spec: "sakura-v1"
category: "AI英語学習"
status: proposal

articles:
  - post_id: 993
    slug: chatgpt-english-learning-steps
    title: "ChatGPTで英語学習を始める手順｜社会人が最初に試す3つの使い方"
    role: "手順"
    with_person: false
    person_reason: >
      手順の記事。読者が知りたいのは「何をどう打つか」で、
      表情や動作は理解を助けない。手元と紙のノートで足りる
    camera_distance: "close on the hands"
    scene: >
      An evening desk seen close up. A pair of adult hands rests over an open
      paper notebook, a pen held loosely between the fingers. The notebook page
      is blank except for three small empty circles drawn in a column. A warm
      desk lamp at the edge of frame, a cream mug, one cherry blossom petal on
      the wood. A closed laptop is pushed to the back, lid down.
    props: ["紙のノート", "ペン", "卓上灯", "クリーム色のマグ", "閉じたノートPC"]
    background: "夜の室内。壁は淡いクリーム"
    lead_text: "ChatGPTに\n何をどう頼むか"
    sub_text: "添削の頼み方の型"
    alt: "ChatGPTで英語学習を始めるときに使う、添削プロンプトの3つの型を紙のノートに書き出している手元"
    filename: "eyecatch-chatgpt-english-learning-steps.jpg"

  - post_id: 995
    slug: ai-eikaiwa-vs-online-eikaiwa
    title: "AI英会話とオンライン英会話の違い｜4つの軸で選ぶ"
    role: "比較"
    with_person: false
    person_reason: >
      比較表の記事。並べる対象そのものを見せるほうが早い。
      人物を置くと、どちらを勧めているかの印象が付いてしまう
    camera_distance: "top-down over a desk"
    scene: >
      A wooden desk seen from directly above, split visually down the middle by
      the natural grain. On the left half, a plain cream mug and a small
      featureless speaker-like object. On the right half, a second cream mug and
      a folded knitted glove, suggesting another person. Between them, four small
      blank cards laid in a row. Everything plain, no markings.
    props: ["マグ2つ", "無地の小さな機械", "手袋", "無地のカード4枚"]
    background: "木目の机。俯瞰"
    lead_text: "AIと人、\nどちらから始める？"
    sub_text: "軸を分けて選ぶ"
    alt: "AI相手と人の講師を、相手・訂正・時間帯・料金の4つの軸で並べて比べる"
    filename: "eyecatch-ai-eikaiwa-vs-online-eikaiwa.jpg"

  - post_id: 997
    slug: ai-translation-why-learn-english
    title: "AI翻訳があるのに英語を学ぶ意味｜場面で分けて考える"
    role: "共感・入口"
    with_person: true
    person_reason: >
      学ぶ意味を疑っている読者の入口。迷いを扱う記事なので、
      「待たせている間合い」を人物の姿勢で見せたほうが伝わる
    camera_distance: "waist-up, half body, from slightly behind"
    scene: >
      A bright street corner in the afternoon. Sakura stands at the right,
      seen from slightly behind and to the side so her face is in three-quarter
      profile, eyes lowered. She holds a phone low at her waist, screen turned
      away and dark. Another person's shoulder is just visible at the frame edge,
      waiting. Soft blurred storefronts behind. Her cardigan is cream with one
      sakura-pink cuff.
    props: ["伏せた携帯", "相手の肩（画面端）", "ぼかした街並み"]
    background: "昼の街角。光は柔らかい"
    lead_text: "AI翻訳があっても\n英語は必要？"
    sub_text: "学ぶ範囲の決め方"
    alt: "AI翻訳を開く待ち時間が問題になる場面で、相手を待たせている様子"
    filename: "eyecatch-ai-translation-why-learn-english.jpg"

  - post_id: 999
    slug: ai-pronunciation-app-how-to-choose
    title: "AI発音矯正アプリの選び方｜自動判定でできることと、できないこと"
    role: "選び方"
    with_person: true
    person_reason: >
      発音は身体の動作が主題。顎に手を当てて音の出し方を確かめる動作が、
      「点数ではなく直し方」という記事の結論をそのまま見せる
    camera_distance: "waist-up, half body"
    scene: >
      A quiet window corner in the morning. Sakura sits at the right in
      three-quarter view, wearing simple over-ear headphones, her hair down with
      the sakura clip visible. One hand rests lightly against her jaw as if
      checking how a sound is formed. Her eyes are lowered, not on any screen.
      A small plain hand mirror lies face-up on the sill beside her. No phone
      screen visible anywhere.
    props: ["ヘッドホン", "小さな手鏡", "窓辺"]
    background: "朝の窓辺。逆光ぎみのやわらかい光"
    lead_text: "発音の点数が出た。\nでも直し方は？"
    sub_text: "選ぶときの確認項目"
    alt: "発音の自動判定で出る点数の外側にある、直し方を確かめようとしている様子"
    filename: "eyecatch-ai-pronunciation-app-how-to-choose.jpg"

  - post_id: 1001
    slug: ai-era-english-how-far
    title: "AI時代に必要な英語力はどこまでか｜場面から決める"
    role: "線引き（ハブ）"
    with_person: false
    person_reason: >
      4つの選択肢から1つを選ぶ、という判断そのものが主題。
      手だけで「選んでいる」が伝わり、人物の表情は要らない
    camera_distance: "top-down over the floor"
    scene: >
      A pale wooden floor seen from above. Four plain cream cards are laid in a
      loose row. Each card carries only a simple hand-drawn icon: an open book,
      an ear, a speech bubble, a pen. One card is pulled slightly forward toward
      the viewer, and a single adult hand rests at its edge. A few cherry blossom
      petals scattered. No words on the cards.
    props: ["無地のカード4枚", "アイコン（本・耳・吹き出し・ペン）", "手"]
    background: "淡い木の床。俯瞰"
    lead_text: "どこまでやれば\n足りるのか"
    sub_text: "自分の場面から決める"
    alt: "読む・聞く・話す・書くの4つから、自分に必要な場面を1つ選んでいる手元"
    filename: "eyecatch-ai-era-english-how-far.jpg"

  - post_id: 1003
    slug: english-meeting-transcription-checklist
    title: "英語会議の文字起こしツールを選ぶ前に｜確認する5つのこと"
    role: "確認項目（実務）"
    with_person: true
    person_reason: >
      実務の場面。会議の直前という状況を、服装と場所と姿勢で見せる必要がある。
      チェックリストだけだと、どの読者向けか伝わらない
    camera_distance: "waist-up, half body, over the shoulder"
    scene: >
      A bright office desk in the morning, seen over Sakura's shoulder from
      behind and to the right. She wears a pale grey blouse with a cream
      cardigan, hair loosely tied with the sakura clip visible, head slightly
      lowered. A headset rests around her neck, unused. On the desk, a plain
      sheet of paper with five empty hand-drawn checkboxes and a pen. A closed
      laptop and a small plain recorder-like object, both without any markings
      or visible screens.
    props: ["ヘッドセット", "空のチェックボックス5つ", "無地のノートPC", "無地の録音機"]
    background: "朝のオフィス。窓からの自然光"
    lead_text: "英語会議の\nAI文字起こし"
    sub_text: "選ぶ前の確認項目"
    alt: "英語会議の文字起こしツールを選ぶ前に確認する5つの項目を、紙のチェックリストで見ている様子"
    filename: "eyecatch-english-meeting-transcription-checklist.jpg"

