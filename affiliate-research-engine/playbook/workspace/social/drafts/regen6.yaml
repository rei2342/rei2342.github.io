articles:
  "546":
    opener_type_x: misreading
    opener_type_threads: short_reassurance
    post_type: direct_answer
    post_type_reason: >
      「続かないのは意志が弱いからか」という1つの問いに対して、記事は
      「やめた瞬間がどちらだったかで見る場所が変わる」と1文で答えている。
      改稿でその答えが冒頭の分岐になり、直接回答の形がより強くなった
    threads_format: two_part
    artifact_used: "授業中／予約前の分岐ごとの見直し項目"
    material:
      search_intent: "オンライン英会話が続かない理由と、続ける方法を知りたい"
      core_answer: "やめた瞬間が授業中だったか予約の前だったかで、見直すものが変わる"
      one_check: "最後にアプリを閉じた場面が、レッスン中だったか予約の画面だったかを思い出す"
      unique_artifact: "授業中で止まった場合の3項目と、予約の前で止まった場合の手数の数え方"
    x: |
      オンライン英会話が続かなかったとき、「意志が弱いのかな」と考えがちです。

      でも先に見たいのは、止まったのがレッスン中か、予約する前か。ここが分かると、次に見直す場所を選びやすくなります。
    x_tail: "2つの分岐はこちら"
    threads:
      - |
        オンライン英会話が続かなかったとき、意志の弱さだけを責めなくて大丈夫です。

        先に確かめたいのは、最後に止まったのがレッスン中だったか、予約する前だったか。どちらかによって、次に見直す場所が変わります。
      - |
        レッスン中に止まった場合に見直すのは、この3つです。

        ・教材のレベル。直近3回で、知らない単語が1文に何個あったか
        ・レッスンの型。フリートークだったか、教材ありだったか
        ・講師との相性。同じ講師だったか、毎回違ったか

        予約する前に止まった場合は、見るところが変わります。話し始めるまでに指を何回動かしているかを、1回だけ数えるところから。

        止まったのは、どちらの場面でしたか？

  "310":
    opener_type_x: reader_scene
    opener_type_threads: reader_scene
    post_type: comparison_axis
    post_type_reason: >
      記事が「無料でできること」と「有料で増えること」を並べたうえで、
      生活側の記録欄を渡している。軸の作り方を渡す形が合う
    threads_format: single
    artifact_used: "7日ぶんの縦型記録と解約期限"
    material:
      search_intent: "無料や低価格の英語アプリだけで足りるのかを知りたい"
      core_answer: "無料で試せる期間は、機能ではなく自分の生活で無理なく開けたかを見る時間にできる"
      one_check: "使う予定だった日に、実際に開けたかどうかを見る"
      unique_artifact: "1日ぶん5行の記入欄を7日ぶんと、初日に見る解約期限と次回の請求日"
    x: |
      無料・低価格の英語アプリを探すと、選択肢が多くて迷うことがあります。

      無料で試せるサービスなら、機能の多さより、使う予定だった日に実際に開けたかを見てみる。生活との相性を確かめやすくなります🌿
    x_tail: "初日に書き出す項目はこちら"
    threads:
      - |
        無料で試せるサービスでも、機能を比べ続けると選びにくくなることがあります。

        そんなときは「高機能か」より「自分の生活の中で無理なく開けたか」を先に見てみると分かりやすいです。

        1日につき、この5行だけ書き出します。

        ・使う予定だった日
        ・実際に開けた日
        ・準備時間
        ・アプリ使用時間
        ・発話時間

        これとは別に、初日のうちに「無料で試せる期間の最終日」と「次回の請求日」を見てカレンダーへ入れておくと安心です📝

        7日ぶん並べると、予定と実際のずれが見えてきます。

  "526":
    opener_type_x: misreading
    opener_type_threads: reader_scene
    post_type: misreading
    post_type_reason: >
      「現地が一番早い」という言われ方を、記事が読み直している。
      費用から出るものと出ないものを分ける、という正し方が芯
    threads_format: single
    artifact_used: "第1カードと第2カードの判断手順"
    material:
      search_intent: "留学と国内の学習で、どちらが早いのかを同じ物差しで比べたい"
      core_answer: "1時間あたりの費用は出せるが、上達の速さはその割り算からは出ない"
      one_check: "費用を英語に触れる時間で割って、何が出て何が出ないかを分ける"
      unique_artifact: "数えられる3つの第1カードと、上達の速さを置く第2カード"
    x: |
      「現地に行くのが一番早い」と聞くと、焦って決めたくなることがあります。

      費用を英語に触れる時間で割ると出るのは、1時間あたりの費用だけ。上達の速さは、その割り算からは出てきません。
    x_tail: "混ぜずに並べる手順はこちら"
    threads:
      - |
        留学の候補を並べるとき、費用と効果を1つの表に入れたくなります。

        でも、数えられるものと数えられないものは、同じカードに入れないほうが見やすいです。

        第1カードに入れるのは、この3つ。

        ・費用総額
        ・英語に触れる時間
        ・1時間あたりの費用（総額 ÷ 時間）

        第2カードに置くのは「上達の速さ」で、これは第1カードからは出せません。比べたいなら、1コマ中に自分が話している時間や、直してもらえる回数を別に記録することになります。

        いま埋められそうなのは、第1カードのどこまでですか？
