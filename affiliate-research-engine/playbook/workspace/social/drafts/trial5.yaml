# 試作5記事の原稿（`social_generate.py --source local --drafts` で読む）
#
# **本文はAPIではなくセッション側で書いた。** 記事本文から素材を4つ抜き、
# XとThreadsで別の素材を使う、という手順は仕様どおり。
# ゲート・在庫の作り方・状態遷移は API 経路とまったく同じものを通す。
# URLは書かない。`social_generate.attach_url()` が末尾に付ける。

articles:
  "521":
    material:
      search_intent: "TOEICのリスニングだけが伸びない。聞き流しを続けていいのかを知りたい"
      core_answer: "聞き流しを増やす前に、音が拾えていないのか、拾えても設問まで残らないのかを切り分ける"
      one_check: "音声を1つ聞いたあと、設問を見ずに内容を1文で言えるかを試す"
      unique_artifact: "止まっている場所を切り分ける3つの確認項目と、最初の2週間の組み方"
    x: |
      リスニングだけ動かないとき、教材を増やす前に見る場所があります。
      音声を1つ聞いたあと、設問を見ずに内容を1文で言えるか試すと、聞き取りの問題か保持の問題かを分けられます。

      止まっている場所を切り分ける3つの確認項目をまとめました
    threads:
      - |
        TOEICのリスニングだけが動かないとき、参考書を替える前に見る場所があります。

        同じ「聞けない」でも、音そのものが拾えていない場合と、拾えているのに設問まで残らない場合では、次にやることが変わります。まず音声を1つ聞いて、設問を見ずに内容を1文で言えるかを試してみてください。言えるのに落とすなら、聞き取りではなく保持のほうです。
      - |
        切り分けが済んだら、次の3つを順に確かめます。

        ・流し終わったあとに内容を1文で言えるか
        ・意味が一拍遅れる感覚があるか
        ・自分の音を録って、お手本と比べられるか

        言えない回が多い時間は、再生時間としては積み上がっていても、入力にはなっていない可能性があります。記録するのは再生時間ではなく、言えた回数のほうです。

        3つの確認項目と、最初の2週間の組み方は記事にまとめています。

  "546":
    material:
      search_intent: "オンライン英会話が続かない。自分の意志が弱いのかを知りたい"
      core_answer: "続かない理由は、話し始めるまでに触る回数が多いこと"
      one_check: "前にやめたサービスを1つ思い出し、止まったのがレッスン中か予約画面かを書き出す"
      unique_artifact: "手数の数え方と、料金を1回あたりで出す試算、解約日を先に決める7日の手順"
    x: |
      オンライン英会話が続かないとき、やめた場所がレッスン中か予約画面かで、直すものが変わります。
      前にやめたサービスを1つ思い出して、止まった瞬間がどちらだったか書き出してみてください。

      手数の数え方と、料金を1回あたりで出す手順をまとめました
    threads:
      - |
        オンライン英会話が続かないと、意志の問題に見えてしまいます。

        でも止まった場所を思い出すと、レッスン中だった人と、予約画面だった人に分かれます。レッスン中なら教材や講師との相性、予約画面なら話し始めるまでの回数の問題です。まず、前にやめたサービスを1つ思い出して、どちらで止まったかを書き出してみてください。
      - |
        予約画面で止まっていたなら、足す前にやめられるものを書き出します。

        ・毎回のレッスン予約
        ・講師を毎回選ぶこと
        ・まとめて時間を取ること

        そのうえで、思い立ってから話し始めるまでに画面を何回触るかを数えます。数が減らないなら、続けるコツを足しても同じ場所で止まります。

        料金を月額ではなく1回あたりで出す試算と、解約日を先に決める7日の手順は記事にまとめています。

  "526":
    material:
      search_intent: "留学と国内の学習で、どちらが早いのかを同じ物差しで比べたい"
      core_answer: "「早い」は単位をそろえないと比べられない。授業時間と、1時間あたりの費用で並べる"
      one_check: "候補の総額を、実際に授業がある時間で割って1時間あたりを出す"
      unique_artifact: "行き先ごとに1時間あたりで並べた比較と、年齢や在学の条件で選べない場合"
    x: |
      現地が一番早いと言われたとき、早さは単位をそろえないと比べられません。
      候補の総額を、実際に授業がある時間で割って1時間あたりを出すと、同じ物差しに乗ります。

      行き先ごとに並べた比較と、年齢の条件で選べない場合をまとめました
    threads:
      - |
        留学と国内の学習、どちらが早いのかを比べようとすると、途中で分からなくなります。

        週の数も総額も、書いてある単位がばらばらだからです。だから先に単位をそろえます。見るのは2つだけ。授業が実際に何時間あるかと、その1時間にいくらかかるか。この形に置き直すと、離れた候補どうしでもはじめて横に並びます。
      - |
        手元の候補で、次の順に出します。

        ・案内に載っている総額を書き出す
        ・実際に授業がある時間を数える
        ・総額を授業時間で割る

        割ってみると、短くて安いほうが1時間あたりでは高い、ということが起こります。期間の長さだけで早さを決めていると、ここが見えません。

        行き先ごとに並べた比較と、年齢や在学の条件で最初から選べない場合は記事にまとめています。

  "23":
    material:
      search_intent: "ワーキングホリデーに必要な貯金額を、自分の条件で知りたい"
      core_answer: "まとめ記事の総額はそのまま使えない。自分の条件で3つに分けて出し直す"
      one_check: "見ている記事が、どの国・どの期間・語学学校ありなしのどれを前提にしているかを確かめる"
      unique_artifact: "必要額を3つの箱に分ける出し方と、ビザの残高証明が目標額とは別だという話"
    x: |
      ワーホリの貯金額は、まとめ記事の総額をそのまま目標にすると合いません。
      見ている記事が、どの国で、どのくらいの期間で、語学学校ありなしのどれを前提にしているかを先に確かめてください。

      必要額を3つに分けて出す手順をまとめました
    threads:
      - |
        ワーホリの貯金がいくら必要かを調べると、大きな総額がひとつ出てきます。

        その数字の中身は、国と滞在期間と、語学学校に行くかどうかで変わります。だから自分の条件に合っているかを先に見ます。いま読んでいる記事がどの前提で書かれているかを確かめてください。前提が違えば、金額もそのまま使えません。
      - |
        自分の条件で出すときは、3つに分けます。

        ・出発までに必ず要るお金
        ・現地で収入が始まるまでの生活費
        ・帰ってきたあとの当座

        分けてから足すと、目標額を上げるほど貯める期間も延びることが見えます。金額と期間はセットで動くので、片方だけを決めると出発日のほうが動きます。足りない分は、額を上げるか期間を延ばすかのどちらかで調整することになります。

        3つの箱の埋め方と、ビザの残高証明が目標額とは別の話であることは記事にまとめています。

  "310":
    material:
      search_intent: "無料や低価格の英語アプリだけで足りるのかを知りたい"
      core_answer: "足りるかどうかは機能の多さではなく、直し方まで返ってくるかで分かれる"
      one_check: "無料期間のうちに、自分の音や文へ直し方の指示が付くかを見る"
      unique_artifact: "無料期間中に確認する項目と、月額ではなく使えた回数で振り返る出し方"
    x: |
      無料の英語アプリで足りるかどうかは、点数が出るかではなく、直し方まで返ってくるかで分かれます。
      無料期間のうちに、自分の音や文に対して直し方の指示が付くかを見てください。

      足りる人と足りない人の分かれ目をまとめました
    threads:
      - |
        無料や低価格の英語アプリで足りるのか迷ったとき、機能の多さで比べても決まりません。

        見るのは、返ってくるものの中身です。点数だけが返るのか、どこをどう直すかまで返るのか。自分で間違いに気づける範囲なら前者で足ります。気づけない部分があるなら、そこだけは人の目が要ります。
      - |
        無料期間のうちに、次を確かめます。

        ・点数だけでなく直し方が返るか
        ・自分の音や文に対して個別に返るか
        ・続けられる時間帯に使えるか

        そのうえで、振り返りは月額ではなく使えた回数で見ます。開かなかった月は、金額ではなく回数のほうに出ます。

        無料期間中の確認項目と、1回あたりで振り返る出し方は記事にまとめています。
