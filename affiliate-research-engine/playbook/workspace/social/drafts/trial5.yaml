# 試作5記事の原稿（`social_generate.py --source local --drafts` で読む）
#
# **本文はAPIではなくセッション側で書いた。** ゲート・在庫・状態遷移は
# API 経路とまったく同じものを通す。URLは attach_url() が末尾に付ける。
#
# 2026-08-09 改訂
#  - 因果・診断・効果の言い切りを、**仮説と確認項目**へ弱めた
#  - 記事ごとに型を選んだ（5本とも別の型。ランダムに選んでいない）
#  - 「〜のとき」「前に見る場所があります」「まず〜ください」
#    「記事にまとめました」の連続をやめた
#  - 記事に無い判断は `inferences` に宣言し、弱めた形でだけ使う

articles:
  # ── 521 小さな実験 ───────────────────────────────
  "521":
    post_type: small_experiment
    post_type_reason: >
      記事に「音声を1つ聞いて、設問を見ずに内容を1文で言えるか試す」という、
      その場で1回できる操作がある。読者が今日試せる形が中心
    material:
      search_intent: "TOEICのリスニングだけが伸びない。聞き流しを続けていいのかを知りたい"
      core_answer: "聞き流しを増やす前に、音が拾えていないのか、拾えても設問まで残らないのかを切り分ける"
      one_check: "音声を1つ聞いたあと、設問を見ずに内容を1文で言えるかを試す"
      unique_artifact: "止まっている場所を切り分ける3つの確認項目と、最初の2週間の組み方"
    x: |
      音声を1つ、設問を見ないで最後まで聞いてみてください。
      そのあと内容を1文で言えるかどうかで、聞き取りで落ちているのか、聞けても残らないのかを疑う向きが変わります。

      切り分けの手順と、続けて見る項目
    threads:
      - |
        TOEICのリスニングが止まっていると、参考書を替えたくなります。その前に、1回だけ試せることがあります。

        音声を1つ、設問を見ずに最後まで聞いてください。そのあとで、内容を1文で言えるかを声に出してみます。言えるのに設問で落ちるなら、聞き取りではなく、聞いた内容が残っていないほうかもしれません。
      - |
        試したあと、続けて確かめる項目が3つあります。

        ・流し終わったあとに内容を1文で言えるか
        ・意味が一拍遅れる感覚があるか
        ・自分の音を録って、お手本と比べられるか

        言えない回が多いなら、その時間は再生時間として積み上がっていても、入力になっていない可能性があります。記録するのを再生時間から言えた回数へ変えると、そこが見えることがあります。

        3つの確認項目と、最初の2週間の組み方は記事のほうに置いています。

  # ── 546 疑問への直接回答 ─────────────────────────
  "546":
    post_type: direct_answer
    post_type_reason: >
      「続かないのは意志が弱いからか」という1つの問いで来る読者に対して、
      記事は「話し始めるまでの手数」という答えを本文の主張として持っている
    material:
      search_intent: "オンライン英会話が続かない。自分の意志が弱いのかを知りたい"
      core_answer: "続かない理由は、話し始めるまでに触る回数が多いこと"
      one_check: "前にやめたサービスを1つ思い出し、止まったのがレッスン中か予約画面かを書き出す"
      unique_artifact: "手数の数え方と、料金を1回あたりで出す試算、解約日を先に決める7日の手順"
    x: |
      オンライン英会話が続かないのは、意志の弱さとは限りません。
      前にやめたサービスを1つ思い出して、止まったのがレッスン中だったか、予約画面だったかを書き出してみてください。

      どちらだったかで、次に見るところが変わります
    threads:
      - |
        オンライン英会話が続かないと、意志の問題に見えてしまいます。ただ、やめた瞬間を思い出すと、人によって場所が違います。

        レッスンの最中だった人と、予約画面で閉じた人。前者なら教材や相性のほう、後者なら話し始めるまでの回数のほうを先に疑う、という分け方ができます。まずどちらだったかを書き出してみてください。
      - |
        予約画面で止まっていたなら、足す前にやめられるものを書き出します。

        ・毎回のレッスン予約
        ・講師を毎回選ぶこと
        ・まとめて時間を取ること

        そのうえで、思い立ってから話し始めるまでに画面を何回触るかを数えます。回数が減っていないなら、続けるコツを足しても同じ場所で止まることがあります。

        回数の数え方と、料金を月額ではなく1回あたりで出す試算、解約日を先に決める7日の手順は記事のほうに置いています。

  # ── 526 よくある読み違い ─────────────────────────
  "526":
    post_type: misreading
    post_type_reason: >
      「現地が一番早い」という言われ方を、記事が読み直している。
      時間の量と上達の速さを分ける、という正し方が記事の芯
    material:
      search_intent: "留学と国内の学習で、どちらが早いのかを同じ物差しで比べたい"
      core_answer: "「早い」には時間の量の話と上達の速さの話が混ざっている。まず分けて、量のほうを数える"
      one_check: "候補の総額を、実際に授業がある時間で割って1時間あたりを出す"
      unique_artifact: "行き先ごとに1時間あたりで並べた比較と、年齢や在学の条件で選べない場合"
    inferences:
      - text: "1時間あたりで見えるのは費用の側で、上達の速さは別に置く必要があります。"
        basis: >
          記事は「ここで出るのは触れる時間あたりの費用で、上達の速さを
          保証するものではない」と書いている。その一文を投稿側で言い直したもの
    x: |
      「現地が一番早い」の早いには、英語に触れる時間の量の話と、上達の速さの話が混ざっています。
      候補の総額を、実際に授業がある時間で割ってみてください。

      出てくるのは費用の側で、速さのほうは別に置きます
    threads:
      - |
        「現地に行くのが一番早い」と言われることがあります。ただ、何が早いのかは、たいてい書かれていません。

        混ざっているのは2つです。英語に触れる時間の量が多いという話と、上達そのものが速いという話。前者は数えられますが、後者は数字にできません。だから、数えられるほうから先に出します。
      - |
        手元の候補で、次の順に出します。

        ・案内に載っている総額を書き出す
        ・実際に授業がある時間を数える
        ・総額を授業時間で割る

        1時間あたりで見えるのは費用の側で、上達の速さは別に置く必要があります。短くて安い候補が、1時間あたりでは高く出ることもあります。

        行き先ごとに並べた表と、年齢や在学の条件で最初から選べない場合は記事のほうに置いています。

  # ── 23 チェックリスト ────────────────────────────
  "23":
    post_type: checklist
    post_type_reason: >
      記事が「3つの箱」と「相談前に書き出す条件」を並べている。
      読者が埋める枠を渡す形が合う
    material:
      search_intent: "ワーキングホリデーに必要な貯金額を、自分の条件で知りたい"
      core_answer: "まとめ記事の総額はそのまま使えない。自分の条件で3つに分けて出し直す"
      one_check: "見ている記事が、どの国・どの期間・語学学校ありなしのどれを前提にしているかを確かめる"
      unique_artifact: "必要額を3つの箱に分ける出し方と、ビザの残高証明が目標額とは別だという話"
    x: |
      ワーホリの貯金額を調べると、大きな総額がひとつ出てきます。
      その記事がどの国で、どのくらいの期間で、語学学校ありなしのどれを前提にしているかを確かめてみてください。

      前提が違えば、金額もそのままでは使えません
    threads:
      - |
        ワーホリの貯金がいくら必要かを調べると、大きな総額がひとつ出てきます。その数字の中身は、国と滞在期間と、語学学校に行くかどうかで変わります。

        だから、いま読んでいる記事がどの前提で書かれているかを先に確かめます。前提が自分と違うなら、その金額はそのままでは使えません。
      - |
        自分の条件で出すときは、3つに分けます。

        ・出発までに必ず要るお金
        ・現地で収入が始まるまでの生活費
        ・帰ってきたあとの当座

        分けてから足すと、目標額を上げるほど貯める期間も延びることが見えてきます。金額と期間はセットで動くので、足りない分は額を上げるか、期間を延ばすかのどちらかで調整することになります。

        3つの箱の埋め方と、ビザの残高証明が目標額とは別の話であることは記事のほうに置いています。

  # ── 310 比較軸 ───────────────────────────────────
  "310":
    post_type: comparison_axis
    post_type_reason: >
      記事が「無料アプリでできること」と「有料で足されること」を
      機能の並びで比べている。軸の作り方を渡す形が合う
    material:
      search_intent: "無料や低価格の英語アプリだけで足りるのかを知りたい"
      core_answer: "機能の数ではなく、返ってくるものの中身で比べる"
      one_check: "無料期間のうちに、自分の音や文へ直し方の指示が付くかを見る"
      unique_artifact: "無料期間中に確認する項目と、月額ではなく使えた回数で振り返る出し方"
    inferences:
      - text: "自分で間違いに気づける範囲かどうかは、比べるときの材料の1つになることがあります。"
        basis: >
          記事は「安いアプリで足りる人」「アプリ以外の練習も検討したい人」を
          分けて書いている。その分け方を投稿側で1行に言い直したもの
    x: |
      英語アプリを比べるとき、機能の数で並べても決まりません。
      無料期間のうちに、自分の音や文に対して直し方まで返ってくるかどうかを見てみてください。

      点数だけが返るのか、直し方まで返るのかで軸が変わります
    threads:
      - |
        無料や低価格の英語アプリで足りるのか。機能の数で並べても、なかなか決まりません。

        軸にしやすいのは、返ってくるものの中身です。点数だけが返るのか、どこをどう直すかまで返るのか。自分で間違いに気づける範囲かどうかは、比べるときの材料の1つになることがあります。
      - |
        無料期間のうちに、次を確かめます。

        ・点数だけでなく直し方が返るか
        ・自分の音や文に対して個別に返るか
        ・続けられる時間帯に使えるか

        振り返るときは、月額ではなく使えた回数で見ます。開かなかった月は、金額よりも回数のほうに出ます。

        無料期間中の確認項目と、1回あたりで振り返る出し方は記事のほうに置いています。
