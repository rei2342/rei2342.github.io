# 試作5記事の原稿（`social_generate.py --source local --drafts` で読む）
#
# **本文はAPIではなくセッション側で書いた。** ゲート・在庫・状態遷移は
# API 経路とまったく同じものを通す。URLは attach_url() が末尾に付ける。
#
# 2026-08-09 改訂
#  - 因果・診断・効果の言い切りを、**仮説と確認項目**へ弱めた
#  - 記事ごとに型を選んだ（5本とも別の型。ランダムに選んでいない）
#  - 「〜のとき」「前に見る場所があります」「まず〜ください」
#    「記事にまとめました」の連続をやめた
#  - 記事に無い判断は `inferences` に宣言し、弱めた形でだけ使う

articles:
  # ── 521 小さな実験 ───────────────────────────────
  "521":
    post_type: small_experiment
    post_type_reason: >
      記事に「音声を1つ聞いて、設問を見ずに内容を1文で言えるか試す」という、
      その場で1回できる操作がある。読者が今日試せる形が中心
    material:
      search_intent: "TOEICのリスニングだけが伸びない。聞き流しを続けていいのかを知りたい"
      core_answer: "聞き流しを増やす前に、音が拾えていないのか、拾えても設問まで残らないのかを切り分ける"
      one_check: "音声を1つ聞いたあと、設問を見ずに内容を1文で言えるかを試す"
      unique_artifact: "止まっている場所を切り分ける3つの確認項目と、最初の2週間の組み方"
    x: |
      音声を1つ、設問を見ないで最後まで聞いてみてください。
      そのあと内容を1文で言えるかどうかで、聞き取りで落ちているのか、聞けても残らないのかを疑う向きが変わります。

      切り分けの手順と、続けて見る項目
    threads:
      - |
        TOEICのリスニングが止まっていると、参考書を替えたくなります。その前に、1回だけ試せることがあります。

        音声を1つ、設問を見ずに最後まで聞いてください。そのあとで、内容を1文で言えるかを声に出してみます。言えるのに設問で落ちるなら、聞き取りではなく、聞いた内容が残っていないほうかもしれません。
      - |
        試したあと、続けて確かめる項目が3つあります。

        ・流し終わったあとに内容を1文で言えるか
        ・意味が一拍遅れる感覚があるか
        ・自分の音を録って、お手本と比べられるか

        言えない回が多いなら、その時間は再生時間として積み上がっていても、入力になっていない可能性があります。記録するのを再生時間から言えた回数へ変えると、そこが見えることがあります。

        3つの確認項目と、最初の2週間の組み方は記事のほうに置いています。

  # ── 546 疑問への直接回答 ─────────────────────────
  "546":
    post_type: direct_answer
    post_type_reason: >
      「続かないのは意志が弱いからか」という1つの問いで来る読者に対して、
      記事は「話し始めるまでの手数」という答えを本文の主張として持っている
    material:
      search_intent: "オンライン英会話が続かない。自分の意志が弱いのかを知りたい"
      core_answer: "続かない理由は、話し始めるまでに触る回数が多いこと"
      one_check: "前にやめたサービスで、やめた瞬間が授業中だったか予約の前だったかを書き出す"
      unique_artifact: "操作の数え方と、料金を1回あたりで出す試算、解約日を先に決める7日の手順"
    x: |
      オンライン英会話が続かないのは、意志の弱さとは限りません。
      前にやめたサービスで、やめた瞬間が授業中だったか、予約の前だったかを書き出してみてください。

      止まった場所によって、見るところが変わることがあります
    threads:
      - |
        オンライン英会話が続かないと、意志の問題に見えてしまいます。ただ、やめた瞬間を思い出すと、人によって場所が違います。

        授業中で止まっていたなら、内容か講師との相性のほうかもしれません。予約の前で閉じていたなら、話し始めるまでの操作の数のほうかもしれません。まず、やめた瞬間がどちらだったかを書き出してみてください。
      - |
        予約の前で止まっていたなら、足すより先に、やめられるものがあるかを見ます。

        ・毎回のレッスン予約
        ・講師を毎回選ぶこと
        ・まとめて時間を取ること

        そのうえで、思い立ってから話し始めるまでの操作を1つずつ数えます。減らしたいのは選択肢の多さではなく、選ぶという行為の回数のほうです。

        操作の数え方と、料金を月額ではなく1回あたりで出す試算、解約日を先に決める7日の手順は記事のほうに置いています。

  # ── 526 よくある読み違い ─────────────────────────
  "526":
    post_type: misreading
    post_type_reason: >
      「現地が一番早い」という言われ方を、記事が読み直している。
      時間の量と上達の速さを分ける、という正し方が記事の芯
    material:
      search_intent: "留学と国内の学習で、どちらが早いのかを同じ物差しで比べたい"
      core_answer: "「早い」には時間の量の話と上達の速さの話が混ざっている。まず分けて、量のほうを数える"
      one_check: "総額を、英語に触れる時間で割って1時間あたりを出す"
      unique_artifact: "行き先ごとに1時間あたりで並べた表と、年齢や在学の条件で選べない場合"
    x: |
      「現地が一番早い」という言い方を見かけます。この早いには、英語に触れる時間の量の話と、上達の速さの話が混ざっていることがあります。
      総額を、英語に触れる時間で割って1時間あたりを出してみてください。

      出てくるのは触れる時間あたりの費用のほうです
    threads:
      - |
        「現地に行くのが一番早い」という言い方を見かけます。ただ、何と比べて早いのかは、たいてい書かれていません。

        その「早い」の中身が、英語に触れる時間の量のことなのか、上達の速さのことなのか。まずここを分けます。数えられるのは前の1つだけで、同じ100時間でも、身につく速さが同じとはかぎりません。
      - |
        手元の候補で、次の順に出します。

        ・案内に載っている総額を書き出す
        ・授業のコマ数×1コマの長さで、触れる時間の合計を出す
        ・総額を触れる時間で割って1時間あたりを出す

        1時間あたりで出るのは触れる時間あたりの費用で、上達の速さを保証するものではありません。短くて安い候補が、1時間あたりでは高く出ることもあります。

        行き先ごとに並べた表と、年齢や在学の条件で最初から選べない場合は記事のほうに置いています。

  # ── 23 チェックリスト ────────────────────────────
  "23":
    post_type: checklist
    post_type_reason: >
      記事が「3つの箱」と「相談前に書き出す条件」を並べている。
      読者が埋める枠を渡す形が合う
    material:
      search_intent: "ワーキングホリデーに必要な貯金額を、自分の条件で知りたい"
      core_answer: "まとめ記事の総額はそのまま使えない。自分の条件で3つに分けて出し直す"
      one_check: "見ている記事が、どの国・どの期間・語学学校ありなしのどれを前提にしているかを確かめる"
      unique_artifact: "必要額を3つの箱に分ける出し方と、ビザの残高証明が目標額とは別だという話"
    x: |
      ワーホリの貯金額を調べると、大きな総額がひとつ出てきます。
      見ている記事が、どの国・どの期間・語学学校ありなしのどれを前提にしているかを確かめてください。

      前提が違えば、その金額は自分の数字ではありません
    threads:
      - |
        ワーホリの貯金がいくら必要かを調べると、大きな総額がひとつ出てきます。同じ「ワーホリの貯金」でも、国、滞在期間、語学学校に行くかどうかで必要額は変わります。

        だから、見ている記事がどの国・どの期間・語学学校ありなしのどれを前提にしているかを先に確かめます。前提が違えば、その金額は自分の数字ではありません。
      - |
        自分の条件で出すときは、3つに分けます。

        ・出発までに払う額。航空券・ビザ・保険・語学学校の初期費用
        ・収入が始まるまでの生活費。現地の1ヶ月の生活費 × 想定月数
        ・日本で止まらない支出。返済・保険・サブスク × 滞在月数

        2番目の月数は1つに決めず、最短と最長の2通りで置いてみてください。最長でも回るなら、それが自分の目標額になります。

        3つの箱の埋め方と、ビザの残高証明が目標額とは別の話であることは記事のほうに置いています。

  # ── 310 比較軸 ───────────────────────────────────
  "310":
    post_type: comparison_axis
    post_type_reason: >
      記事が「無料アプリでできること」と「有料で足されること」を並べ、
      無料期間中に見る項目まで出している。軸の作り方を渡す形が合う
    material:
      search_intent: "無料や低価格の英語アプリだけで足りるのかを知りたい"
      core_answer: "無料で試せる期間は、サービスの良し悪しではなく、自分の生活が飲み込めるかを見る時間として使う"
      one_check: "1週間で何日、実際に開けたかを数えて、予定した日数と比べる"
      unique_artifact: "無料期間中に確認する5項目と、月額ではなく使えた回数で振り返る出し方"
    x: |
      英語アプリを比べるとき、月額の安い順に並べても決まりません。
      無料で試せる期間は、1週間で何日、実際に開けたかを数える時間として使ってみてください。

      見るのはサービスの良し悪しより、自分の生活が飲み込めるかどうかです
    threads:
      - |
        無料や低価格の英語アプリで足りるのか。月額の安い順に並んだ表を見ても、なかなか決まりません。

        無料で試せる期間は、サービスの良し悪しを見る時間ではありません。自分の生活がその予定を飲み込めるかを見る時間として使います。1週間で何日、実際に開けたか。予定した日数と比べてみてください。
      - |
        無料期間のうちに確かめるのは、次の項目です。

        ・続けられる頻度。1週間で何日、実際に開けたか
        ・1回にかかる時間。準備を含めて何分かかったか
        ・アプリを使った時間と、声を出した時間。この2つは分けて記録する
        ・やめるときの手順。いつまでに解約すれば次の請求が来ないか

        学習アプリが自動で数えてくれるのは、開いた回数と学習時間で、声を出した回数ではありません。だから3番目は意識しないと記録に残りません。

        無料期間中の確認項目と、月額ではなく使えた回数で振り返る出し方は記事のほうに置いています。
