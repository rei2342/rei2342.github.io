# 試作5記事の原稿（`social_generate.py --source local --drafts` で読む）
#
# **本文はAPIではなくセッション側で書いた。** ゲート・在庫・状態遷移は
# API 経路とまったく同じものを通す。URLは attach_url() が末尾に付ける。
#
# 2026-08-09 改訂（1回目）
#  - 因果・診断・効果の言い切りを、**仮説と確認項目**へ弱めた
#  - 記事ごとに型を選んだ（5本とも別の型）
#
# 2026-08-10 改訂（マーケットイン）
#  - **X 5本と Threads 2本（310・526）は、指定された本文をそのまま置いた。**
#    語順・語尾・絵文字を変えていない。末尾の `[URL]` だけは、
#    attach_url() が本物のURLを付けるので落としてある
#  - Threads 23・521・546 は指定が無いので、同じ温度で書き直した。
#    代弁 → 受け止め → 一覧 → 一手 → 問いか導線、の順
#
# 2026-08-10 改訂（形の比較）
#  - X-521 の 🎧 を 💭 へ（4役に無い絵文字だった）
#  - **Threadsは1投稿型と2投稿型を両方残す。** 310・526 が1投稿完結、
#    23・521・546 が2投稿構成。CLAUDE.md の実測（2連・リンクは2投稿目）と
#    指定の改訂例（1投稿完結）を、どちらも消さずに並べて測る
#  - **同じ記事を割っただけのA/B案は作らない。** 形ごとに記事が違い、
#    使う固有の成果物も別（`artifact_used`）
#  - 投稿後に views/replies/reposts/profile_visits/link_clicks を入れる欄を
#    在庫へ持たせた（生成時は空）

articles:
  # ── 521 小さな実験 ───────────────────────────────
  "521":
    opener_type_x: reader_scene
    opener_type_threads: conclusion_first
    post_type: small_experiment
    post_type_reason: >
      記事に「音声を1つ聞いて、設問を見ずに内容を1文で言えるか試す」という、
      その場で1回できる操作がある。読者が今日試せる形が中心
    material:
      search_intent: "TOEICのリスニングだけが伸びない。聞き流しを続けていいのかを知りたい"
      core_answer: "聞き流しを増やす前に、音が拾えていないのか、拾えても設問まで残らないのかを切り分ける"
      one_check: "音声を1つ聞いたあと、設問を見ずに内容を1文で言えるかを試す"
      unique_artifact: "止まっている場所を切り分ける3つの確認項目と、最初の2週間の組み方"
    # **指定された本文（逐語）**
    x: |
      リスニングが伸びないと、教材を増やしたくなりますよね。

      その前に、音声を1つだけ設問なしで聞いて、内容を1文で言えるか試してみる。次に見る場所を絞りやすくなります💭
    x_tail: "確認の順番はこちら"
    threads_format: two_part
    artifact_used: "止まっている場所を切り分ける3つの確認項目"
    threads:
      - |
        TOEICのリスニングは、教材の数より、どこで止まっているかで次が変わります。

        音が拾えていないのか、拾えても設問まで残らないのか。今日1回、音声を1つだけ設問を見ずに聞いて、内容を1文で言えるか試してみると分かりやすいです。
      - |
        TOEICのリスニングが伸びないときは、まず3つの角度から確かめられます。

        ・流し終わったあとに内容を1文で言えるか
        ・意味が一拍遅れる感覚があるか
        ・自分の音を録って、お手本と比べられるか

        言えるのに設問で迷うなら、音そのものとは別の場所も見る余地があります。記録するものを再生時間から「言えた回数」に変えておくと、あとで見返しやすくなります🌿

        3つのうち、いちばん自信がないのはどれですか？

  # ── 546 疑問への直接回答 ─────────────────────────
  "546":
    opener_type_x: misreading
    opener_type_threads: short_reassurance
    post_type: direct_answer
    post_type_reason: >
      「続かないのは意志が弱いからか」という1つの問いで来る読者に対して、
      記事は「話し始めるまでの手数」という答えを本文の主張として持っている
    material:
      search_intent: "オンライン英会話が続かない。自分の意志が弱いのかを知りたい"
      core_answer: "続かない理由は、話し始めるまでに触る回数が多いこと"
      one_check: "前にやめたサービスで、やめた瞬間が授業中だったか予約の前だったかを書き出す"
      unique_artifact: "操作の数え方と、料金を1回あたりで出す試算、解約日を先に決める7日の手順"
    # **指定された本文（逐語）**
    x: |
      オンライン英会話が続かなかったとき、意志の弱さだけを責めなくて大丈夫です。

      授業中に止まったのか、予約の前で止まったのか。ここを分けるだけで、次に見直す場所が変わります🌿
    x_tail: "続け方を考える前の整理はこちら"
    threads_format: two_part
    artifact_used: "話し始めるまでの操作の数え方"
    threads:
      - |
        オンライン英会話が続かなかったとき、まず自分の意志を疑ってしまいます。

        でも、思い出したいのは「やめた瞬間がどこだったか」のほうです。授業の途中で閉じたのか、予約の画面で閉じたのか。同じ「続かない」でも、次に見る場所は別になります。
      - |
        オンライン英会話を予約の前で閉じていたなら、足すより先に、やめられるものを探します。

        ・毎回のレッスン予約
        ・講師を毎回選ぶこと
        ・まとめて時間を取ること

        そのうえで、思い立ってから話し始めるまでの操作を1つずつ数えます。予約前で止まる場合は、選択肢の数だけでなく、話し始めるまでに判断する回数も減らせるか確認します。

        最後に閉じたのは、授業中でしたか。それとも予約の前でしたか？

  # ── 526 よくある読み違い ─────────────────────────
  "526":
    opener_type_x: misreading
    opener_type_threads: reader_scene
    post_type: misreading
    post_type_reason: >
      「現地が一番早い」という言われ方を、記事が読み直している。
      時間の量と上達の速さを分ける、という正し方が記事の芯
    material:
      search_intent: "留学と国内の学習で、どちらが早いのかを同じ物差しで比べたい"
      core_answer: "「早い」には時間の量の話と上達の速さの話が混ざっている。まず分けて、量のほうを数える"
      one_check: "総額を、英語に触れる時間で割って1時間あたりを出す"
      unique_artifact: "行き先ごとに1時間あたりで並べた表と、年齢や在学の条件で選べない場合"
    # **指定された本文（逐語）**
    x: |
      「現地に行くのが一番早い」と聞くと、焦って決めたくなることがあります。

      ただ、英語に触れる時間の多さと、上達の速さは別の話。費用を時間で割って分かること・分からないことを分けました📝
    threads_format: single
    artifact_used: "時間の量と上達の速さを分ける2つの軸"
    # **指定された本文（逐語）**
    threads:
      - |
        「現地に行けば早く伸びる」と聞くと、留学の総額も正当化したくなります。

        でも、ここは2つに分けて見たいところです。

        ・英語に触れる時間がどれくらい増えるか
        ・その時間でどれくらい上達するか

        総額を授業時間で割ると分かるのは、1時間あたりの費用。上達の速さまでは、その割り算だけでは分かりません。

        比較表を見るときは「この数字は何を測っている？」を一度だけ確認してみてください📝

  # ── 23 チェックリスト ────────────────────────────
  "23":
    opener_type_x: reader_scene
    opener_type_threads: reader_scene
    post_type: checklist
    post_type_reason: >
      記事が「3つの箱」と「相談前に書き出す条件」を並べている。
      読者が埋める枠を渡す形が合う
    material:
      search_intent: "ワーキングホリデーに必要な貯金額を、自分の条件で知りたい"
      core_answer: "まとめ記事の総額はそのまま使えない。自分の条件で3つに分けて出し直す"
      one_check: "見ている記事が、どの国・どの期間・語学学校ありなしのどれを前提にしているかを確かめる"
      unique_artifact: "必要額を3つの箱に分ける出し方と、ビザの残高証明が目標額とは別だという話"
    # **指定された本文（逐語）**
    x: |
      ワーホリの費用を調べると、大きな総額が出てきて不安になりますよね。

      でも、その数字が自分に当てはまるとは限りません。まずは国・期間・語学学校の有無から見ておくと安心です📝
    x_tail: "自分用の金額に直す手順はこちら"
    threads_format: two_part
    artifact_used: "必要額を3つの箱に分ける出し方"
    threads:
      - |
        ワーホリの貯金を調べると、大きな総額がひとつ出てきます。そこで困るのは、自分にも同じ金額が必要なのか分からないことです。

        その金額は、たいてい誰かの条件で計算されています。国、滞在期間、語学学校に行くかどうかで必要額は変わるので、そのまま自分の数字にしなくて大丈夫です。
      - |
        ワーホリの貯金を自分の条件で出すときは、3つに分けます。

        ・出発までに払う額。航空券・ビザ・保険・語学学校の初期費用
        ・収入が始まるまでの生活費。現地の1ヶ月の生活費 × 想定月数
        ・日本で止まらない支出。返済・保険・サブスク × 滞在月数

        2番目の月数は1つに決めず、最短と最長の2通りで置いてみます。どこまで余裕を持たせるかを決める材料になります。

        数字を置けなかった欄が、次に確認するところです🌿

  # ── 310 比較軸 ───────────────────────────────────
  "310":
    opener_type_x: reader_scene
    opener_type_threads: reader_scene
    post_type: comparison_axis
    post_type_reason: >
      記事が「無料アプリでできること」と「有料で足されること」を並べ、
      無料期間中に見る項目まで出している。軸の作り方を渡す形が合う
    material:
      search_intent: "無料や低価格の英語アプリだけで足りるのかを知りたい"
      core_answer: "無料で試せる期間は、サービスの良し悪しではなく、自分の生活が飲み込めるかを見る時間として使う"
      one_check: "1週間で何日、実際に開けたかを数えて、予定した日数と比べる"
      unique_artifact: "無料期間中に確認する5項目と、月額ではなく使えた回数で振り返る出し方"
    # **指定された本文（逐語）**
    x: |
      安い英語アプリほど、どれを選べばいいか迷うことがあります。

      無料期間中は、機能より先に「予定した日に無理なく開けたか」を見てみると、生活との相性が分かりやすいです🌿
    x_tail: "選ぶ前の確認項目はこちら"
    threads_format: single
    artifact_used: "無料期間中にメモする4項目"
    # **指定された本文（逐語）**
    threads:
      - |
        無料や低価格の英語アプリ、機能を比べるほど迷ってしまうことがあります。

        そんなときは「高機能か」より、「自分の生活の中で無理なく開けたか」を先に見てみると分かりやすいです🌿

        無料期間中にメモするのは、この4つだけ。

        ・使う予定だった日
        ・実際に開けた日
        ・準備にかかった時間
        ・解約期限と次回の請求日

        アプリ内の記録だけでは分からないことは、別に1行だけ残しておく。あとで比較するとき、かなり楽になります📝
