#   未取得 … 画面に出ていない／APIが返さない／その指標が無い。`未取得` と書く
#   0      … **画面にその欄があり、そこに 0 と表示されている。** 0 と書く
# 混ぜると「反応が無かった」と「見ていない」が区別できなくなる。
# 迷ったら `未取得`。0 は、画面で 0 を見たときだけ書く。
#
# 見る場所（役割が違うので混ぜない）:
#   views / likes / replies / reposts / profile_visits → 各SNSの画面
#   link_clicks                                        → GA4（utm_content で在庫を特定）
#   followers_at_observation                           → プロフィール画面

