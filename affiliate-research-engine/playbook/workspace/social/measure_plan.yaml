# 取らずに欠測として閉じる。0を入れない、推定で埋めない。
status: closed_missing
closed_at: "2026-08-16"
closed_reason: >
  計測予定（8/11・8/12）に取得しなかった。時刻が過ぎた指標は再現できない。
  0と未取得を混ぜない規則をここでも通し、**欠測のまま確定**させる。
  この2件は媒体比較のサンプルに使わない
usable_for_comparison: false

# ── 各回で記録する項目（24時間値と48時間値は上書きせず別々に持つ）──
# platform側で取れるもの: views likes replies reposts profile_visits link_clicks
# GA4側で取れるもの:      landing_sessions（着地セッション）key_events/cta_clicks
# **XとThreadsで取れる指標が違う。比べるのは両方で取れたものだけ。**
fields:
  - posted_at
  - observed_at
  - elapsed_hours
  - pinned
  - followers_at_observation
  - views
  - likes
  - replies
  - reposts
  - profile_visits
  - link_clicks              # platform側
  - ga4_landing_sessions     # GA4の着地セッション（utm_contentで特定）
  - ga4_key_events           # GA4のキーイベント or CTAクリック
comparable_metrics_note: >
  両方の画面で同じ定義で取れるのは views / likes / replies / reposts と
  GA4側の landing_sessions。profile_visits と link_clicks は
  media によって定義も取得可否も違うので、**そろわないうちは比較に使わない**。
one_pair_only: >
  今あるのは記事546の1組だけ。**ここから一般則は出さない。**
  「Xのほうが強い」「2投稿型が効く」のような結論は、
  組がもっと増えるまで書かない。

