article: 23
note: >
  役割を「目標額の決め方」に寄せる。冒頭でどちらを読めばよいかを明示し、
  149と重なる「渡航前の英語で②を短くする手順」を1行にして149へ送る。
  **slug・URL・タイトル・CTAのリンク先は変えない。新しい数字も足さない。**
guards:
  must_contain:
  - <p>この記事では、<strong>自分に必要な額を自分で出す手順</strong>と、目標額を決めるときに一緒に見る項目を書く。</p>
  - <h2>貯めながら、渡航後の月数を短くする</h2>
  - → ネイティブキャンプ留学で留学費用の無料見積もりを取る
  - カナダ ワーホリの費用を3つの箱で出す手順
  must_not_contain: []
replacements:

# ① 冒頭で役割を明示する（どちらを読めばよいか）
- find: '<p>この記事では、<strong>自分に必要な額を自分で出す手順</strong>と、目標額を決めるときに一緒に見る項目を書く。</p>'
  replace: '<p>この記事では、<strong>自分に必要な額を自分で出す手順</strong>と、目標額を決めるときに一緒に見る項目を書く。</p>


    <p><strong>この記事は「目標額をいくらに置くか」を決めるためのもの</strong>で、国を問わず使える。渡航先をカナダに決めていて、費用の項目を1つずつ埋めて計算する段階なら、<a href="https://sakura-eigo.com/%e3%80%8c%e3%82%ab%e3%83%8a%e3%83%80-%e3%83%af%e3%83%bc%e3%83%9b%e3%83%aa-%e8%b2%bb%e7%94%a8-2024%e3%80%8d%e3%81%a7%e4%b8%a6%e3%81%b6150%e4%b8%87%e3%83%bb250%e4%b8%87%e3%81%ae%e8%a6%8b%e7%a9%8d/">カナダ ワーホリの費用を3つの箱で出す手順</a>のほうが近い。数値例と、②を1ヶ月動かしたときの効き方まで置いてある。</p>'

# ② 149と重なる手順を1行にして、詳しい手順は149へ送る
- find: '<p><strong>確認項目</strong>：仕事のある日の夜に話す練習を入れて、2ヶ月続くかを見る。続くなら、渡航後も枠は残りやすい。</p>'
  replace: '<p><strong>確認項目</strong>：仕事のある日の夜に話す練習を入れて、2ヶ月続くかを見る。続くなら、渡航後も枠は残りやすい。いつから始めるか、続かなかったときにどう読むかは<a href="https://sakura-eigo.com/%e3%80%8c%e3%82%ab%e3%83%8a%e3%83%80-%e3%83%af%e3%83%bc%e3%83%9b%e3%83%aa-%e8%b2%bb%e7%94%a8-2024%e3%80%8d%e3%81%a7%e4%b8%a6%e3%81%b6150%e4%b8%87%e3%83%bb250%e4%b8%87%e3%81%ae%e8%a6%8b%e7%a9%8d/">カナダ ワーホリの費用を3つの箱で出す手順</a>の「渡航前の英語を、費用計算の外側に置かない」に置いてある。</p>'

# ③ 相談前のリンクに、どちらを読めばよいかを付ける
- find: '<p>カナダの費用項目を1つずつ埋めるなら<a href="https://sakura-eigo.com/%e3%80%8c%e3%82%ab%e3%83%8a%e3%83%80-%e3%83%af%e3%83%bc%e3%83%9b%e3%83%aa-%e8%b2%bb%e7%94%a8-2024%e3%80%8d%e3%81%a7%e4%b8%a6%e3%81%b6150%e4%b8%87%e3%83%bb250%e4%b8%87%e3%81%ae%e8%a6%8b%e7%a9%8d/">カナダ ワーホリの費用を3つの箱で出す手順</a>、'
  replace: '<p><strong>ここまでで目標額が決まったら、次は行き先ごとの計算になる。</strong>カナダの費用項目を1つずつ埋めるなら<a href="https://sakura-eigo.com/%e3%80%8c%e3%82%ab%e3%83%8a%e3%83%80-%e3%83%af%e3%83%bc%e3%83%9b%e3%83%aa-%e8%b2%bb%e7%94%a8-2024%e3%80%8d%e3%81%a7%e4%b8%a6%e3%81%b6150%e4%b8%87%e3%83%bb250%e4%b8%87%e3%81%ae%e8%a6%8b%e7%a9%8d/">カナダ ワーホリの費用を3つの箱で出す手順</a>、'
