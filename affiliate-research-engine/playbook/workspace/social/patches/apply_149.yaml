article: 149
note: >
  役割を「カナダの費用を3つの箱で計算する」に寄せる。冒頭でどちらを読めばよいか
  を明示し、23と重なる「目標額を上げることの代償」を1行にして23へ送る。
  **slug・URL・タイトル・CTAのリンク先は変えない。新しい数字も足さない。**
guards:
  must_contain:
  - <p>この記事では、まとめ記事の総額を「自分が必要な額」に組み替える手順を書く。</p>
  - <h3>「多く貯めれば安心」は、貯める期間と引き換えになる</h3>
  - → 留学情報館の無料カウンセリングを申し込む
  - ワーホリの貯金はいくら必要かを自分の数字で出す
  must_not_contain: []
replacements:

# ① 冒頭で役割を明示する（どちらを読めばよいか）
- find: '<p>この記事では、まとめ記事の総額を「自分が必要な額」に組み替える手順を書く。</p>'
  replace: '<p>この記事では、まとめ記事の総額を「自分が必要な額」に組み替える手順を書く。</p>


    <p><strong>この記事は、渡航先をカナダに置いたうえで費用を計算するためのもの</strong>で、数値例と、②の月数を1ヶ月動かしたときに総額がどれだけ動くかまで置いてある。まだ「目標額をいくらに置くか」から迷っている段階なら、<a href="https://sakura-eigo.com/%e3%80%8c%e3%83%af%e3%83%bc%e3%83%9b%e3%83%aa-%e8%b2%af%e9%87%91-%e3%81%84%e3%81%8f%e3%82%89%e5%bf%85%e8%a6%81%e3%80%8d%e3%81%a7%e5%87%ba%e3%81%9f200%e4%b8%87%e3%81%ab%e6%80%af%e3%81%88%e3%81%a6/">ワーホリの貯金はいくら必要かを自分の数字で出す</a>を先に読むほうが早い。ビザの残高証明の扱いも、そちらに置いてある。</p>'

# ② 23と重なる「目標額を上げることの代償」を短くして、23へ送る
- find: '<h3>「多く貯めれば安心」は、貯める期間と引き換えになる</h3>


    <p><strong>提案</strong>：目標額を上げると、出発が後ろにずれる。年齢条件がある制度を使うなら、貯める期間そのものが判断材料になる。</p>


    <p><strong>確認項目</strong>：目標額を10万円上げたとき、出発が何ヶ月遅れるかを計算する。この2つを並べて、どちらのリスクを取るかを決める。</p>'
  replace: '<h3>「多く貯めれば安心」は、貯める期間と引き換えになる</h3>


    <p><strong>提案</strong>：目標額を上げると、出発が後ろにずれる。年齢条件がある制度を使うなら、貯める期間そのものが判断材料になる。目標額そのものをどう決めるか（上げた分で出発が何ヶ月遅れるか、足りない分を期間で調整する手もあること）は、<a href="https://sakura-eigo.com/%e3%80%8c%e3%83%af%e3%83%bc%e3%83%9b%e3%83%aa-%e8%b2%af%e9%87%91-%e3%81%84%e3%81%8f%e3%82%89%e5%bf%85%e8%a6%81%e3%80%8d%e3%81%a7%e5%87%ba%e3%81%9f200%e4%b8%87%e3%81%ab%e6%80%af%e3%81%88%e3%81%a6/">ワーホリの貯金はいくら必要かを自分の数字で出す</a>に置いてある。この記事では、決まった目標額をカナダの項目へ落とすところを扱う。</p>'
