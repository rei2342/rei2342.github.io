# 記事526の1か所を直す。**費用効率と学習速度の取り違え。**
#
# 「4週間で約100時間、国内の週1回なら年単位」という差は、
# **英語に触れる時間の量**の差であって、上達の速さの差ではない。
# 記事の別の場所（「1時間あたりに、そろえられない場合」）では
# 「上達の速さを保証するものではない」と書いてあるので、
# ここだけが言い切りになっていて食い違っている。

post_id: 526
reason: "触れる時間の量を「早い」の中身だと言い切っている。上達の速さと分ける"
replacements:
  - find: "<strong>この差が「早い」の中身</strong>になる。"
    replace: >-
      <strong>ここで比べているのは、英語に触れる時間の量だけ</strong>である。同じ100時間でも、身につく速さが同じとはかぎらない。「早い」と言われているものの中身が、時間の量のことなのか、上達の速さのことなのかを、先に分けて見る。
verify_after:
  must_contain:
    - "ここで比べているのは"
    - "上達の速さを保証するものではない"
  must_not_contain:
    - "この差が「早い」の中身"
