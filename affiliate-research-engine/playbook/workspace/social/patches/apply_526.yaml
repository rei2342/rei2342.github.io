article: 526
note: 公開中の本文には「最低価格保証」もネイティブキャンプ留学のCTAも無い。控え（raw.html）は古かった。CTAは phil_navi の1本だけなので、1本のまま位置づけを明示する
guards:
  must_contain:
  - <h2>費用と時間を、候補ごとに並べる</h2>
  - <h2>今日、1時間あたりを出して並べる</h2>
  - → フィリピン留学ナビ公式サイトで語学学校の情報を確認する
  must_not_contain:
  - 最低価格保証
  - <h3>第1カード｜数えられる3つ</h3>
  - 2週間より短い
replacements:
- find: <p>この記事では、費用と時間を同じ単位に揃えて、行き先を比べる方法を書く。</p>
  replace: '<p>この記事では、費用と時間を同じ単位に揃えて、行き先を比べる方法を書く。</p>


    <p><strong>注記</strong>：同じ条件を指しているように見える検索結果でも、前提の違う数字が並んでいることがある。この記事を書くにあたって検索したときも、含まれている項目が揃っていない金額が並んでいた（2026年8月10日に検索して確認）。<strong>金額を比べる前に、その数字が何を含んでいるかを先に見る。</strong>ここが揃っていない数字どうしを並べても、比べたことにならない。</p>'
- find: 同じ100時間でも、身につく速さが同じとはかぎらない。「早い」と言われているものの中身が、
  replace: 同じ100時間でも、身につく速さが同じとはかぎらない。このあとの2枚のカードでも、費用と時間は同じカードに入れるが、上達の速さだけは別のカードに分けている。「早い」と言われているものの中身が、
- find: '<h2>費用と時間を、候補ごとに並べる</h2>


    <p><strong>確認項目</strong>：表を作って、行き先ごとに次の4つを埋める。</p>


    <ol>

    <li>期間中に英語に触れる<strong>時間の合計</strong></li>

    <li>払う<strong>総額</strong>（授業料・滞在費・渡航費・保険）</li>

    <li><strong>1時間あたり</strong>（総額 ÷ 時間）</li>

    <li>その期間、<strong>仕事をどうするか</strong>（休職・退職・有給）</li>

    </ol>


    <p><strong>提案</strong>：4つ目が埋まらないと、社会人にとっての実質はわからない。学生と同じ表で比べると、判断がずれる。</p>


    '
  replace: '<h2>費用と時間を、混ぜずに並べる</h2>


    <p>数えられるものと、数えられないものを、同じカードに入れない。ここを混ぜると「1時間あたりが安い＝早い」と読めてしまう。</p>


    <h3>第1カード｜数えられる3つ</h3>


    <p><strong>確認項目</strong>：候補を3つまでに絞って、行き先ごとにこの3つを埋める。</p>


    <ul>

    <li><strong>費用総額</strong>（授業料・滞在費・渡航費・保険）</li>

    <li><strong>英語に触れる時間</strong>（授業のコマ数 × 1コマの長さ）</li>

    <li><strong>1時間あたりの費用</strong>（費用総額 ÷ 英語に触れる時間）</li>

    </ul>


    <p><strong>提案</strong>：費用総額には、その期間の仕事の扱い（休職・退職・有給）で変わる分も入れる。学生と同じ数字で比べると、社会人にとっての実質からずれる。</p>


    <h3>第2カード｜このカードからは出せないもの</h3>


    <ul>

    <li><strong>上達の速さ</strong>（第1カードからは算出できない）</li>

    </ul>


    <p>1時間あたりで分かるのは、英語に触れる1時間あたりにいくら払うか、それだけだ。<strong>1時間あたりが安い候補が、上達が速い候補だとはかぎらない。</strong></p>


    <p><strong>提案</strong>：上達の速さを比べたい場合は、費用とは別の記録が要る。たとえばこういうものになる。</p>


    <ul>

    <li>1コマの中で、自分が話している時間がどれくらいあるか</li>

    <li>間違いを直してもらえる回数があるか</li>

    <li>授業のあとに復習する時間が取れる組み方か</li>

    </ul>


    <p>これらは金額表には載らないので、学校ごとに個別に確かめることになる。</p>


    '
- find: <p><strong>提案</strong>：語学留学であれば年齢条件がない国もある。制度で選べない行き先は表から外して、残ったものだけで比べる。</p>
  replace: <p><strong>提案</strong>：年齢の条件は制度と国によって違う。ワーキングホリデーで対象から外れた場合に、語学留学など別の枠が使えるかどうかも、同じ公式ページで確認する。制度で選べない行き先はカードから外して、残ったものだけで比べる。</p>
- find: <p><strong>確認項目</strong>：表を埋め終わったら、最後に「帰国後に続ける形」の行を足す。そこが空欄なら、行き先を決める前にそこを決める。</p>
  replace: <p><strong>確認項目</strong>：カードを埋め終わったら、最後に「帰国後に続ける形」の行を足す。そこが空欄なら、行き先を決める前にそこを決める。</p>
- find: '">→ フィリピン留学ナビ公式サイトで語学学校の情報を確認する</a></p>'
  replace: '">→ フィリピン留学ナビ公式サイトで語学学校の情報を確認する</a></p>


    <p>フィリピンを候補に入れていて、第1カードの「費用総額」を自分では出せない場合は、相談の窓口がある。</p>'
- find: <h2>今日、1時間あたりを出して並べる</h2>
  replace: '<h2>この出し方が向かない場合</h2>


    <p><strong>提案</strong>：この記事の出し方（1時間あたりで並べる）が合わないこともある。</p>


    <ul>

    <li><strong>期間の短い候補と長い候補を並べる場合</strong>。渡航費の比重が変わるので、1時間あたりの出方もずれる。同じくらいの期間どうしでしか比べられない</li>

    <li><strong>金額より生活を優先したい場合</strong>。治安・食事・気候・時差はこの計算に入らない。1時間あたりが最も安い候補が、自分にとって続けやすい候補とはかぎらない</li>

    <li><strong>まだ候補が1つも無い場合</strong>。カードは候補を比べる道具なので、埋める相手がいないと使えない。先に条件（期間・予算の上限・仕事の扱い）を決めるほうが早い</li>

    <li><strong>年齢や在学の条件で選べない行き先がある場合</strong>。制度で外れるものをカードに残すと、比較そのものがずれる</li>

    </ul>


    <p>上の1つ目か2つ目に当てはまるなら、このカードよりも、実際に行った人の生活面の記録のほうが役に立つ。</p>


    <h2>今日、1時間あたりを出して並べる</h2>'
