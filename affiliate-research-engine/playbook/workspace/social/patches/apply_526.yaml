article: 526
note: >
  中心命題（1時間あたりの費用から上達の速さは出ない）を導入で先に言い、
  4つが1段落に詰まっているところを分ける。**新しい数字・相場は足さない。**
guards:
  must_contain:
  - <p>この記事では、費用と時間を同じ単位に揃えて、行き先を比べる方法を書く。</p>
  - このあとの2枚のカードでも、費用と時間は同じカードに入れるが
  - → フィリピン留学ナビ公式サイトで語学学校の情報を確認する
  must_not_contain: []
replacements:

# ① 導入で中心命題を先に言う（タイトル・H2と揃える）
- find: '<p>この記事では、費用と時間を同じ単位に揃えて、行き先を比べる方法を書く。</p>'
  replace: '<p>この記事では、費用と時間を同じ単位に揃えて、行き先を比べる方法を書く。</p>


    <p>先に結論を1つ置く。<strong>1時間あたりの費用からは、上達の速さは出ない。</strong>計算で出せるのは「英語に触れる1時間あたりにいくら払うか」までで、その1時間でどれだけ伸びるかは別の話になる。この記事では、計算できるものを第1カード、計算できないものを第2カードに分けて置く。</p>'

# ② 4つが1段落に詰まっているところを、数える話と分ける話に切る
- find: '<p>例として、4週間で1日6コマ（1コマ50分）の学校なら、平日20日で約100時間になる（試算）。国内で週1回50分のレッスンを受ける場合、同じ100時間に達するには単純計算で年単位になる。<strong>ここで比べているのは、英語に触れる時間の量だけ</strong>である。同じ100時間でも、身につく速さが同じとはかぎらない。このあとの2枚のカードでも、費用と時間は同じカードに入れるが、上達の速さだけは別のカードに分けている。「早い」と言われているものの中身が、時間の量のことなのか、上達の速さのことなのかを、先に分けて見る。</p>'
  replace: '<p>例として、4週間で1日6コマ（1コマ50分）の学校なら、平日20日で約100時間になる（試算）。国内で週1回50分のレッスンを受ける場合、同じ100時間に達するには単純計算で年単位になる。</p>


    <p><strong>ここで比べているのは、英語に触れる時間の量だけ</strong>である。同じ100時間でも、身につく速さが同じとはかぎらない。</p>


    <p>「早い」と言われているものの中身が、<strong>時間の量</strong>のことなのか、<strong>上達の速さ</strong>のことなのかを、先に分けて見る。このあとの2枚のカードでも、費用と時間は同じカードに入れるが、上達の速さだけは別のカードに分けている。</p>'
