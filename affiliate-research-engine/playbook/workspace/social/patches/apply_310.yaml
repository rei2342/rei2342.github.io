article: 310
note: H2は7本のまま。サービス固有の無料日数・料金・解約方法を新しく書かない
guards:
  must_contain:
  - <h2>無料期間中に確認する項目</h2>
  - → スパトレ（第二言語習得論ベースの英語トレーニング）の7日間無料体験を見る
  must_not_contain:
  - <h3>1日ぶんの記入欄</h3>
replacements:
- find: <p>この記事では、無料と低価格のアプリで何ができて、有料になると何が増えるのかを整理する。
  replace: '<p>機能を比べるほど迷ってしまうところなので、先に見る場所を1つに絞ります。</p>


    <p>この記事では、無料と低価格のアプリで何ができて、有料になると何が増えるのかを整理する。'
- find: <p>マイクに向かって単語や文を読むと、機械が判定して点数を返すタイプもある。無料枠で使えるかどうかはサービスによる。自分の発音を数値で見られるので、独学の目安になる。</p>
  replace: <p>読んだ音を機械が判定して点数で返す形。使える範囲はサービスによって違う。</p>
- find: <p>連続日数、学習時間、正答率。この3つを自動で記録するアプリは多い。あとから振り返る材料になるので、この記録は残しておく価値がある。</p>
  replace: <p>連続日数・学習時間・正答率。ここは自動で残る。残らないものがあとで効くので、それは下の記入欄で自分で書く。</p>
- find: <p>判定して点数を出すところまでなら、無料枠で使えるサービスもある。有料の区分では、どう直すかの指示までセットになっていることがある。自分の弱点を自分で解釈しなくてよくなる。</p>
  replace: <p>点数を出すところまでは無料枠にもある。有料側で増えるのは、どう直すかの指示のほう。</p>
- find: <p>何を、どの順番で、どれだけやるか。ここを決めてくれる形は、有料側で見かけることが多い。自分で組み立てる手間がなくなるかわりに、決まった時間を空ける必要が出てくる。</p>
  replace: <p>順番を決めてくれる形は有料側に多い。そのかわり、決まった時間を空ける必要が出てくる。</p>
- find: '<h2>無料期間中に確認する項目</h2>


    <p>無料で試せる期間は、機能だけでなく、<strong>自分の生活の中で無理なく使えるか</strong>を確かめる時間にもできる。確認するのは次の5つでいい。</p>


    <ol>

    <li><strong>続けられる頻度</strong>。1週間で何日、実際に開けたか。予定した日数と比べる</li>

    <li><strong>1回にかかる時間</strong>。準備を含めて何分かかったか。手帳に置けるサイズか</li>

    <li><strong>アプリを使った時間と、声を出した時間</strong>。この2つは分けて記録する</li>

    <li><strong>アプリ内のスコアと、実際に発話した回数</strong>。片方だけでは判断できない</li>

    <li><strong>やめるときの手順</strong>。いつまでに解約すれば次の請求が来ないか</li>

    </ol>


    <p>アプリによって記録される項目は違う。学習時間だけが残る場合は、声を出した回数を別に記録すると振り返りやすくなる。</p>


    '
  replace: '<h2>無料で試せる期間に、この5つだけ書き出す</h2>


    <p>無料で試せる期間は、機能だけでなく、<strong>自分の生活の中で無理なく使えるか</strong>を確かめる時間にもできる。書き出すのは5つだけです。</p>


    <h3>1日ぶんの記入欄</h3>


    <p><strong>確認項目</strong>：手帳でもスマホのメモでもいいので、1日につきこの5行を作る。7日ぶんで終わります。</p>


    <ul>

    <li><strong>使う予定だった日</strong>（前の晩に決めた予定。あとから書き足さない）</li>

    <li><strong>実際に開けた日</strong>（開けたかどうかだけ）</li>

    <li><strong>準備時間</strong>（開こうと思ってから最初の1問までにかかった時間）</li>

    <li><strong>アプリ使用時間</strong>（アプリの画面を見ていた時間）</li>

    <li><strong>発話時間</strong>（声に出していた時間。アプリ使用時間とは分ける）</li>

    </ul>


    <p><strong>提案</strong>：この5行を7日ぶん並べると、機能の比較では出てこないものが見えます。<strong>使う予定だった日</strong>と<strong>実際に開けた日</strong>がずれているなら、それは機能ではなく、置き場所の問題であることが多い。</p>


    <p>アプリによって記録される項目は違う。学習時間だけが残る場合は、声を出した回数を別に記録すると振り返りやすくなる。</p>


    <h3>解約期限と次回の請求日</h3>


    <p><strong>確認項目</strong>：上の5行とは別に、試し始めた初日にこの2つを見てカレンダーへ入れる。</p>


    <ul>

    <li><strong>無料で試せる期間の最終日</strong></li>

    <li><strong>次回の請求日</strong></li>

    </ul>


    <p><strong>提案</strong>：期間の長さも解約の手順もサービスごとに違い、変わることもあります。この記事に日数を書かないのはそのためで、<strong>初日に画面で見た日付</strong>を入れるのがいちばん確かです。</p>


    '
- find: '">→ speek公式サイトで発音矯正スクールの内容を確認する</a></p>'
  replace: '">→ speek公式サイトで発音矯正スクールの内容を確認する</a></p>


