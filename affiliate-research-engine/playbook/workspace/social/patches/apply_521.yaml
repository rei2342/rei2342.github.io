article: 521
note: >
  3つの症状（拾えない／意味が遅れる／設問まで残らない）の関係を1か所で示し、
  CTAがどの分岐向けかを明示し、今日やることを末尾に置く。
  **新しい事実・数字・相場・体験は足さない。** 本文にある内容の並べ直しだけ。
guards:
  must_contain:
  - <h2>確認1、どこで止まっているかを切り分ける</h2>
  - 内容を1文で言えるか</strong>を試す。言えるのに設問で落とすなら保持の問題
  - → speek公式サイトで発音矯正スクールの内容を確認する
  - → スパトレ（第二言語習得論ベースの英語トレーニング）の7日間無料体験を見る
  - <h2>最初の2週間の組み方</h2>
  must_not_contain: []
replacements:

# ① 3つの症状の関係を、確認1の入口に置く（分岐が読めるようにする）
- find: '<h2>確認1、どこで止まっているかを切り分ける</h2>


    <h3>音が拾えていないのか、拾えているのに残らないのか</h3>'
  replace: '<h2>確認1、どこで止まっているかを切り分ける</h2>


    <p>リスニングが止まる場所は、この記事では3つに分けて見る。<strong>①音そのものが拾えていない</strong>、<strong>②拾えているが意味が一拍遅れる</strong>、<strong>③意味は追えているが設問まで残らない</strong>。同じ「聞き取れない」でも、次に見る場所が変わる。</p>


    <p>1つ目の確認項目で①と③が分かれ、2つ目の確認項目で②があるかどうかが分かる。②は①③のどちらとも重なることがあるので、別に確かめる。</p>


    <h3>音が拾えていないのか、拾えているのに残らないのか</h3>'

# ② speek の CTA が、どの分岐の人向けかを明示する
- find: '<p>この2つは扱う範囲が違う。<strong>speekは音の直し方</strong>、<strong>スパトレは話す練習の量</strong>になる。</p>'
  replace: '<p>この2つは扱う範囲が違う。<strong>speekは音の直し方</strong>、<strong>スパトレは話す練習の量</strong>になる。</p>

    <p>確認1で<strong>①（音そのものが拾えていない）</strong>に寄っていて、確認3で自分ではずれを言葉にできなかった場合が、ここを見る段階にあたる。③（設問まで残らない）だけなら、先に確認2の記録から始めるほうが近い。</p>'

# ③ 末尾に、今日できることを1か所へまとめる
- find: '<p>続いていないなら、置く場所が合っていない。中身を変えるより先に、枠のほうを変える。</p>'
  replace: '<p>続いていないなら、置く場所が合っていない。中身を変えるより先に、枠のほうを変える。</p>


    <h2>今日、この3つだけ試す</h2>


    <ul>

    <li>音声を1つ聞いて、<strong>設問を見ずに内容を1文で言えるか</strong>を試す（①か③かが分かれる）</li>

    <li>そのとき、<strong>意味が一拍遅れる感覚があるか</strong>を確かめる（②があるかどうか）</li>

    <li>その日の終わりに、<strong>内容を言えた回数</strong>を書く。再生時間は書かない</li>

    </ul>


    <p>3つとも今日のうちに終わる。ここで出た結果が、確認3へ進むかどうかの材料になる。</p>'
