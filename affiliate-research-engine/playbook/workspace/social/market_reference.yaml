# 参考にした投稿の記録
#
# **本文を保存・転載しない。** 残すのは構造と観察結果だけ。
# 採るのは構造・改行・語尾・絵文字の役割。採らなかった表現も残す。
#
# 検査: scripts/social_gate.py の market_reference_gate()
# 必須項目: url / account / observed_on / reactions_at_observation /
#           structure_taken / not_taken / applied_to_sakura / not_copied

meta:
  observed_by: "運用者（人）"
  recorded_on: "2026-08-10"
  fetch_note: >
    **ツールからは取得できない。** x.com と threads.com は
    このコンテナの egress で遮断されている（about.fb.com も同じ）。
    Xの3件は 2026-08-10 に人が公開画面を見て数字を入れた。
    Threadsの2件は**まだ未取得**。**0を入れていない。**
  reaction_source_x: "公開X画面を人が確認（2026-08-10）"
  approximate_note: >
    Xの表示は概数で丸められる（35万・2.4万など）。
    丸められている値には `approximate: true` を付けた。
    **丸め値を厳密な数として比較に使わない**

# ── 観測から何が言えるか（**効果の証明として扱わない**）──
interpretation:
  x_like_rate: >
    同一アカウントの観測2件では、未完成の本音を含む投稿のいいね率が
    高かった。ただし投稿時期、固定状態、表示経路、経過時間が異なるため、
    因果や3倍の効果とは判定しない。市場仮説として保持し、
    さくら自身の実投稿で検証する。
  status: 市場仮説
  verify_with: "さくら自身の実投稿（在庫の metrics 欄）"
  do_not: >
    **反応率を効果の証明として使わない。** 条件が一致していない観測値であり、
    仕様や本文の根拠にしない

# ── 反応率を比べるために保存する項目 ────────────────
# 条件をそろえないと比べられない。**欄を先に作っておく**
reaction_fields:
  required:
    - posted_at
    - observed_at
    - elapsed_hours
    - pinned
    - followers_at_observation
    - views
    - likes
    - replies
    - reposts
    - link_clicks
    - profile_visits
  rule: >
    **未取得は `未取得` と書く。0を入れない。**
    posted_at・elapsed_hours・pinned・followers_at_observation が
    欠けている観測は、率の比較に使わない

