text: '「現地に行くのが一番早い」と聞くと、焦って決めたくなることがあります。


  費用を英語に触れる時間で割ると出るのは、1時間あたりの費用だけ。上達の速さは、その割り算からは出てきません。


  記事では、費用と上達速度を分けて比べる手順をまとめました。

