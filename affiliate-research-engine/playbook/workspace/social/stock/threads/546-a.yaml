article_title: オンライン英会話が続かないのは、話し始めるまでの手数が多いから
article_url: https://sakura-eigo.com/online-english-lessons-90-days-success/
text: 'オンライン英会話が続かないと、意志の問題に見えてしまいます。ただ、やめた瞬間を思い出すと、人によって場所が違います。


  レッスンの最中だった人と、予約画面で閉じた人。前者なら教材や相性のほう、後者なら話し始めるまでの回数のほうを先に疑う、という分け方ができます。まずどちらだったかを書き出してみてください。


  予約画面で止まっていたなら、足す前にやめられるものを書き出します。


  ・毎回のレッスン予約

  ・講師を毎回選ぶこと

  ・まとめて時間を取ること


  そのうえで、思い立ってから話し始めるまでに画面を何回触るかを数えます。回数が減っていないなら、続けるコツを足しても同じ場所で止まることがあります。


  回数の数え方と、料金を月額ではなく1回あたりで出す試算、解約日を先に決める7日の手順は記事のほうに置いています。

  https://sakura-eigo.com/online-english-lessons-90-days-success/?utm_source=threads'
