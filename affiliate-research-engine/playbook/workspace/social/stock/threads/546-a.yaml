article_title: オンライン英会話が続かないのは、話し始めるまでの手数が多いから
article_url: https://sakura-eigo.com/online-english-lessons-90-days-success/
text: 'オンライン英会話が続かないと、意志の問題に見えてしまいます。ただ、やめた瞬間を思い出すと、人によって場所が違います。


  授業中で止まっていたなら、内容か講師との相性のほうかもしれません。予約の前で閉じていたなら、話し始めるまでの操作の数のほうかもしれません。まず、やめた瞬間がどちらだったかを書き出してみてください。


  予約の前で止まっていたなら、足すより先に、やめられるものがあるかを見ます。


  ・毎回のレッスン予約

  ・講師を毎回選ぶこと

  ・まとめて時間を取ること


  そのうえで、思い立ってから話し始めるまでの操作を1つずつ数えます。減らしたいのは選択肢の多さではなく、選ぶという行為の回数のほうです。


  操作の数え方と、料金を月額ではなく1回あたりで出す試算、解約日を先に決める7日の手順は記事のほうに置いています。

  https://sakura-eigo.com/online-english-lessons-90-days-success/?utm_source=threads'
