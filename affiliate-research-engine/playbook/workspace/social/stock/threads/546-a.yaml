article_title: オンライン英会話が続かないのは、話し始めるまでの手数が多いから
article_url: https://sakura-eigo.com/online-english-lessons-90-days-success/
text: 'オンライン英会話が続かなかったとき、まず自分の意志を疑ってしまいます。


  でも、思い出したいのは「やめた瞬間がどこだったか」のほうです。授業の途中で閉じたのか、予約の画面で閉じたのか。同じ「続かない」でも、次に見る場所は別になります。


  オンライン英会話を予約の前で閉じていたなら、足すより先に、やめられるものを探します。


  ・毎回のレッスン予約

  ・講師を毎回選ぶこと

  ・まとめて時間を取ること


  そのうえで、思い立ってから話し始めるまでの操作を1つずつ数えます。予約前で止まる場合は、選択肢の数だけでなく、話し始めるまでに判断する回数も減らせるか確認します。


  最後に閉じたのは、授業中でしたか。それとも予約の前でしたか？

  https://sakura-eigo.com/online-english-lessons-90-days-success/?utm_source=threads'
