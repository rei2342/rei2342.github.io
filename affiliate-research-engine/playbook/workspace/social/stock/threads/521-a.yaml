article_title: TOEICリスニングが止まっているとき、聞き流しを続ける前に確認する3つのこと
article_url: https://sakura-eigo.com/toeic-listening-325-to-improvement/
text: 'TOEICのリスニングは、教材の数より、どこで止まっているかで次が変わります。


  音が拾えていないのか、拾えても設問まで残らないのか。今日1回、音声を1つだけ設問を見ずに聞いて、内容を1文で言えるか試してみると分かりやすいです。


  TOEICのリスニングが伸びないときは、まず3つの角度から確かめられます。


  ・流し終わったあとに内容を1文で言えるか

  ・意味が一拍遅れる感覚があるか

  ・自分の音を録って、お手本と比べられるか


  言えるのに設問で迷うなら、音そのものとは別の場所も見る余地があります。記録するものを再生時間から「言えた回数」に変えておくと、あとで見返しやすくなります🌿


  3つのうち、いちばん自信がないのはどれですか？

  https://sakura-eigo.com/toeic-listening-325-to-improvement/?utm_source=threads'
