article_title: TOEICリスニングが止まっているとき、聞き流しを続ける前に確認する3つのこと
article_url: https://sakura-eigo.com/toeic-listening-325-to-improvement/
text: 'TOEICのリスニングだけが動かないとき、参考書を替える前に見る場所があります。


  同じ「聞けない」でも、音そのものが拾えていない場合と、拾えているのに設問まで残らない場合では、次にやることが変わります。まず音声を1つ聞いて、設問を見ずに内容を1文で言えるかを試してみてください。言えるのに落とすなら、聞き取りではなく保持のほうです。


  切り分けが済んだら、次の3つを順に確かめます。


  ・流し終わったあとに内容を1文で言えるか

  ・意味が一拍遅れる感覚があるか

  ・自分の音を録って、お手本と比べられるか


  言えない回が多い時間は、再生時間としては積み上がっていても、入力にはなっていない可能性があります。記録するのは再生時間ではなく、言えた回数のほうです。


  3つの確認項目と、最初の2週間の組み方は記事にまとめています。

  https://sakura-eigo.com/toeic-listening-325-to-improvement/?utm_source=threads'
