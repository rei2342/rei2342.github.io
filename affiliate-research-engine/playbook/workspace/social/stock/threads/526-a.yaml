article_title: 「現地が一番早い」を費用と時間で確かめる｜1時間あたりで並べる
article_url: https://sakura-eigo.com/fast-verify-cost-time-travel/
text: '「現地に行くのが一番早い」と言われることがあります。ただ、何が早いのかは、たいてい書かれていません。


  混ざっているのは2つです。英語に触れる時間の量が多いという話と、上達そのものが速いという話。前者は数えられますが、後者は数字にできません。だから、数えられるほうから先に出します。


  手元の候補で、次の順に出します。


  ・案内に載っている総額を書き出す

  ・実際に授業がある時間を数える

  ・総額を授業時間で割る


  1時間あたりで見えるのは費用の側で、上達の速さは別に置く必要があります。短くて安い候補が、1時間あたりでは高く出ることもあります。


  行き先ごとに並べた表と、年齢や在学の条件で最初から選べない場合は記事のほうに置いています。

  https://sakura-eigo.com/fast-verify-cost-time-travel/?utm_source=threads'
