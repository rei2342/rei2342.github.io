article_title: 「現地が一番早い」を費用と時間で確かめる｜1時間あたりで並べる
article_url: https://sakura-eigo.com/fast-verify-cost-time-travel/
text: '留学と国内の学習、どちらが早いのかを比べようとすると、途中で分からなくなります。


  週の数も総額も、書いてある単位がばらばらだからです。だから先に単位をそろえます。見るのは2つだけ。授業が実際に何時間あるかと、その1時間にいくらかかるか。この形に置き直すと、離れた候補どうしでもはじめて横に並びます。


  手元の候補で、次の順に出します。


  ・案内に載っている総額を書き出す

  ・実際に授業がある時間を数える

  ・総額を授業時間で割る


  割ってみると、短くて安いほうが1時間あたりでは高い、ということが起こります。期間の長さだけで早さを決めていると、ここが見えません。


  行き先ごとに並べた比較と、年齢や在学の条件で最初から選べない場合は記事にまとめています。

  https://sakura-eigo.com/fast-verify-cost-time-travel/?utm_source=threads'
