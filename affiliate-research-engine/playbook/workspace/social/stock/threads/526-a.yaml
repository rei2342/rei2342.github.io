article_title: 「現地が一番早い」を費用と時間で確かめる｜1時間あたりで並べる
article_url: https://sakura-eigo.com/fast-verify-cost-time-travel/
text: '「現地に行くのが一番早い」という言い方を見かけます。ただ、何と比べて早いのかは、たいてい書かれていません。


  その「早い」の中身が、英語に触れる時間の量のことなのか、上達の速さのことなのか。まずここを分けます。数えられるのは前の1つだけで、同じ100時間でも、身につく速さが同じとはかぎりません。


  手元の候補で、次の順に出します。


  ・案内に載っている総額を書き出す

  ・授業のコマ数×1コマの長さで、触れる時間の合計を出す

  ・総額を触れる時間で割って1時間あたりを出す


  1時間あたりで出るのは触れる時間あたりの費用で、上達の速さを保証するものではありません。短くて安い候補が、1時間あたりでは高く出ることもあります。


  行き先ごとに並べた表と、年齢や在学の条件で最初から選べない場合は記事のほうに置いています。

  https://sakura-eigo.com/fast-verify-cost-time-travel/?utm_source=threads'
