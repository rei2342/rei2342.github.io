article_title: オンライン英会話が続かないのは、話し始めるまでの手数が多いから
article_url: https://sakura-eigo.com/online-english-lessons-90-days-success/
text: 'オンライン英会話が続かなかったとき、意志の弱さだけを責めなくて大丈夫です。


  先に確かめたいのは、最後に止まったのがレッスン中だったか、予約する前だったか。どちらかによって、次に見直す場所が変わります。


  レッスン中に止まった場合に見直すのは、この3つです。


  ・教材のレベル。直近3回で、知らない単語が1文に何個あったか

  ・レッスンの型。フリートークだったか、教材ありだったか

  ・講師との相性。同じ講師だったか、毎回違ったか


  予約する前に止まった場合は、見るところが変わります。話し始めるまでに指を何回動かしているかを、1回だけ数えるところから。


  止まったのは、どちらの場面でしたか？

  https://sakura-eigo.com/online-english-lessons-90-days-success/?utm_source=threads&utm_medium=social&utm_campaign=social_pilot_20260810&utm_content=threads_546_b'
