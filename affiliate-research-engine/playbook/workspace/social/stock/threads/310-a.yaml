article_title: 無料・低価格の英語アプリで足りる人と、足りない人の分かれ目
article_url: https://sakura-eigo.com/cheap-english-learning-apps-free/
text: '無料や低価格の英語アプリで足りるのか迷ったとき、機能の多さで比べても決まりません。


  見るのは、返ってくるものの中身です。点数だけが返るのか、どこをどう直すかまで返るのか。自分で間違いに気づける範囲なら前者で足ります。気づけない部分があるなら、そこだけは人の目が要ります。


  無料期間のうちに、次を確かめます。


  ・点数だけでなく直し方が返るか

  ・自分の音や文に対して個別に返るか

  ・続けられる時間帯に使えるか


  そのうえで、振り返りは月額ではなく使えた回数で見ます。開かなかった月は、金額ではなく回数のほうに出ます。


  無料期間中の確認項目と、1回あたりで振り返る出し方は記事にまとめています。

  https://sakura-eigo.com/cheap-english-learning-apps-free/?utm_source=threads'
