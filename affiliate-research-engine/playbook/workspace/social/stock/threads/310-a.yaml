article_title: 無料・低価格の英語アプリで足りる人と、足りない人の分かれ目
article_url: https://sakura-eigo.com/cheap-english-learning-apps-free/
text: '無料や低価格の英語アプリで足りるのか。機能の数で並べても、なかなか決まりません。


  軸にしやすいのは、返ってくるものの中身です。点数だけが返るのか、どこをどう直すかまで返るのか。自分で間違いに気づける範囲かどうかは、比べるときの材料の1つになることがあります。


  無料期間のうちに、次を確かめます。


  ・点数だけでなく直し方が返るか

  ・自分の音や文に対して個別に返るか

  ・続けられる時間帯に使えるか


  振り返るときは、月額ではなく使えた回数で見ます。開かなかった月は、金額よりも回数のほうに出ます。


  無料期間中の確認項目と、1回あたりで振り返る出し方は記事のほうに置いています。

  https://sakura-eigo.com/cheap-english-learning-apps-free/?utm_source=threads'
