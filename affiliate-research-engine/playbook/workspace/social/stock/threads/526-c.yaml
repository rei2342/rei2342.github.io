article_title: 「現地が一番早い」を費用と時間で確かめる｜1時間あたりで並べる
article_url: https://sakura-eigo.com/fast-verify-cost-time-travel/
text: '留学の候補を並べるとき、費用と効果を1つの表に入れたくなります。


  でも、数えられるものと数えられないものは、同じカードに入れないほうが見やすいです。


  第1カードに入れるのは、この3つ。


  ・費用総額

  ・英語に触れる時間

  ・1時間あたりの費用（総額 ÷ 時間）


  第2カードに置くのは「上達の速さ」で、これは第1カードからは出せません。比べたいなら、1コマ中に自分が話している時間や、直してもらえる回数を別に記録することになります。


  いま埋められそうなのは、第1カードのどこまでですか？

  https://sakura-eigo.com/fast-verify-cost-time-travel/?utm_source=threads&utm_medium=social&utm_campaign=social_pilot_20260810&utm_content=threads-526-c'
