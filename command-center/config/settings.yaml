# COMMAND CENTER 設定
# アカウントの事実（ID・URL・案件）は accounts_master.json だけに置く。ここに書くのは「動かし方」だけ。

llm:
  model: claude-opus-5-5          # 量産時に下げたいなら claude-sonnet-5-5
  effort: high                    # low | medium | high | xhigh | max
  max_tokens: 32000
  use_server_fallback: true       # 拒否時にサーバー側で別モデルへ自動フォールバック

mode:
  # true の間はどの publisher も外部に書き込まない（payload を data/outbox に保存するだけ）
  dry_run: true

publishing:
  # マスターの automation_contract.publish_or_send_authorized は false。
  # 書き込み許可は Astra の調査結果ではなく、ここで人が明示的に出す。
  require_approval: true          # draft → approved を経たものだけ配信
  enabled:                        # account internal_key → platform → true
    # sakura_eigo30: {wordpress: true, x: true}
    # akira_life_500: {note: true, instagram: true}
  wordpress:
    default_status: draft         # draft | publish
  note:
    mode: draft_only              # note は下書き投入まで。公開は人が押す
    storage_state_dir: data/sessions
  instagram:
    # IG Graph API は画像を公開URLで渡す必要がある。
    # 例: このリポジトリの GitHub Pages を使うなら https://rei2342.github.io/command-center/data/media
    public_media_base_url: ""
    media_dir: data/media

credentials:
  # 既存 GitHub Secrets（WP_APP_PASSWORD / X_API_KEY 等）は さくら(sakura-eigo.com) 用。
  # アカウント別キー（X_API_KEY__SAKURA_EIGO30 など）が無いときだけ、この1アカウントに素のキーを使う。
  global_fallback_account: sakura_eigo30

affiliate:
  pr_label: "PR"                  # ステマ規制（2023/10〜）対応。アフィリンクを含む投稿に必ず付ける
  pr_label_required: true
  # もしもの登録媒体ID → 登録URL。マスターに対応表が無いので、確定したら記入する。
  # 記入が無い媒体IDの案件は「媒体一致を確認できない」として自動挿入しない。
  moshimo_media_map: {}
    # "677298": "https://sakura-eigo.com/"
    # "684125": "https://erabi-ai.com/"
  # マスターでは全案件 auto_publish_allowed=false。人が確認した案件だけここで許可する。
  auto_publish_overrides: []      # 例: ["s00000017068001"]

funnel:
  # マスターで prelaunch / unverified の誘導先は自動では使わない。稼働したらここに足す。
  extra_destinations: {}
    # kasumi_nagi_: [{type: line, url: "https://lin.ee/tcuxNo6", label: "なぎLINE"}]

buzz:
  platforms: [x, threads]
  lookback_hours: 48
  min_age_minutes: 30
  thresholds:
    x:
      impressions: 5000
      impressions_per_hour: 800
      engagement_rate: 0.02
    threads:
      views: 3000
      views_per_hour: 500
  auto_reply: false               # true でも dry_run 中は送らない
  max_replies_per_account_per_day: 3
  allow_affiliate_in_auto_reply: false   # false = 自分の note / WP 記事URLだけをぶら下げる

schedule:
  buzz_hunter_interval_minutes: 30
  crawler_interval_hours: 24
  quiet_hours_jst: [1, 6]         # この時間帯は自動リプライしない

platform_limits:
  x_weighted_chars: 280           # 日本語は1文字2カウント → 実質140字
  threads_chars: 500
  ig_caption_chars: 2200
  ig_hashtags_max: 5
  ig_carousel_slides_min: 5
  ig_carousel_slides_max: 10
