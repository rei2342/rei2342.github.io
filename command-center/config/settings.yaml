# COMMAND CENTER 設定
# アカウントの事実（ID・URL・案件）は accounts_master.json だけに置く。ここに書くのは「動かし方」だけ。

llm:
  model: claude-opus-5-5          # 量産時に下げたいなら claude-sonnet-5-5
  effort: high                    # low | medium | high | xhigh | max
  max_tokens: 32000
  use_server_fallback: true       # 拒否時にサーバー側で別モデルへ自動フォールバック（anthropic_api のみ）
  # 上から順に試す。claude_cli はローカルの Claude Code CLI（サブスク枠・APIクレジット不要）。
  # 鍵や CLI が無いものは飛ばし、残高不足・認証失敗などで落ちたら次へ。拒否された場合は次へ回さず止める。
  backends: [claude_cli, anthropic_api, openai, gemini]
  claude_cli_path: ""             # 空なら PATH → ~/.claude/local → Claude デスクトップ同梱の順に探す
  cli_model: claude-opus-5-5
  cli_timeout_sec: 900
  openai_model: gpt-5
  gemini_model: gemini-2.5-pro

mode:
  # true の間はどの publisher も外部に書き込まない（payload を data/outbox に保存するだけ）
  dry_run: true

publishing:
  # マスターの automation_contract.publish_or_send_authorized は false。
  # 書き込み許可は Astra の調査結果ではなく、ここで人が明示的に出す。
  require_approval: true          # draft → approved を経たものだけ配信
  enabled:                        # account internal_key → platform → true
    # sakura_eigo30: {wordpress: true, x: true}
    # akira_life_500: {note: true, instagram: true}
  wordpress:
    default_status: draft         # draft | publish
  note:
    mode: draft_only              # note は下書き投入まで。公開は人が押す
    storage_state_dir: data/sessions
  instagram:
    # IG Graph API は画像を公開URLで渡す必要がある。
    # 例: このリポジトリの GitHub Pages を使うなら https://rei2342.github.io/command-center/data/media
    public_media_base_url: ""     # 空なら WordPress のメディアに自動アップロードしてそのURLを使う
    media_dir: data/media
    # 自分のWPが無いアカウント（AKIRA等）の画像を置くWPアカウント。空なら credentials.global_fallback_account
    media_wp_account: ""

credentials:
  # 既存 GitHub Secrets（WP_APP_PASSWORD / X_API_KEY 等）は さくら(sakura-eigo.com) 用。
  # アカウント別キー（X_API_KEY__SAKURA_EIGO30 など）が無いときだけ、この1アカウントに素のキーを使う。
  global_fallback_account: sakura_eigo30

affiliate:
  pr_label: "PR"                  # ステマ規制（2023/10〜）対応。アフィリンクを含む投稿に必ず付ける
  pr_label_required: true
  # もしもの登録媒体ID → 登録URL。マスターに対応表が無いので、確定したら記入する。
  # 記入が無い媒体IDの案件は「媒体一致を確認できない」として自動挿入しない。
  # 2026-11-07 実測: 公開記事の現行タグに各媒体の a_id が載っていることを WP REST で確認して記入
  #   677298: sakura-eigo.com 公開記事に a_id=5640991/5640981/5640990/5640982（マスターで 677298 の現行コード）
  #   684125: erabi-ai.com 公開記事に a_id=5805180/5876760（マスターで 684125 の現行コード）
  moshimo_media_map:
    "677298": "https://sakura-eigo.com/"
    "684125": "https://erabi-ai.com/"
  # マスターでは全案件 auto_publish_allowed=false。人が確認した案件だけここで許可する。
  auto_publish_overrides: []      # 例: ["s00000017068001"]

funnel:
  # マスターで prelaunch / unverified の誘導先は自動では使わない。稼働したらここに足す。
  extra_destinations: {}
    # kasumi_nagi_: [{type: line, url: "https://lin.ee/tcuxNo6", label: "なぎLINE"}]

buzz:
  platforms: [x, threads]
  lookback_hours: 48
  min_age_minutes: 30
  thresholds:
    x:
      impressions: 5000
      impressions_per_hour: 800
      engagement_rate: 0.02
    threads:
      views: 3000
      views_per_hour: 500
  auto_reply: false               # true でも dry_run 中は送らない
  max_replies_per_account_per_day: 3
  allow_affiliate_in_auto_reply: false   # false = 自分の note / WP 記事URLだけをぶら下げる

schedule:
  buzz_hunter_interval_minutes: 30
  crawler_interval_hours: 24
  quiet_hours_jst: [1, 6]         # この時間帯は自動リプライしない

crawl:
  # X / IG のログイン壁対策（API トークンが無いときの取得順）:
  #   1) 専用プロファイル（python main.py browser-login x|instagram で人が一度ログイン。パスワードは保存しない）
  #   2) ローカルの投稿ログ data/local_posts/<internal_key>/<platform>.jsonl ＋ 下の local_log_globs
  #   3) X のみ Nitter 系 RSS  4) 公開ページ
  # Chrome 本体のプロファイル／Cookie は読まない（Keychain の保存済み認証情報に触れるため）。
  browser_profile_dir: data/browser_profiles
  local_log_globs:
    # {platform} {handle} {account} を置換。相対パスは command-center/ 基準。文字列だけなら本人の投稿を url/handle で絞って読む
    - path: "../affiliate-research-engine/playbook/workspace/social/history/{platform}.jsonl"
      account: sakura_eigo30      # さくらの投稿履歴（本文に handle が無いので所有者を明示）
  nitter_instances: [https://nitter.net, https://xcancel.com, https://nitter.poast.org]

platform_limits:
  x_weighted_chars: 280           # 日本語は1文字2カウント → 実質140字
  threads_chars: 500
  ig_caption_chars: 2200
  ig_hashtags_max: 5
  ig_carousel_slides_min: 5
  ig_carousel_slides_max: 10
