name: Daily Article Drafter

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日06:00 JST (= 21:00 UTC)
  workflow_dispatch:       # 手動実行も可能

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Daily Article Drafter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.REI_AFFSAKU }}
        run: |
          claude -p "affiliate-research-engine/playbook/workspace/keywords.csv の status=todo から1件キーワードを選び、以下の手順で記事ドラフトを生成してください。手順: 1.keywords.csvのstatus=todoから1件選ぶ。2.そのキーワードでWeb検索しSERP上位の見出し構造・論点TOP5・抜け穴を分析。3.上位を抜く独自構造(H2x6,H3x各3)で4000字以上のドラフト生成。NG:「〜について」「〜することが大切」禁止/箇条書きで逃げない/同語尾3連続禁止/冒頭挨拶禁止。4.affiliate-research-engine/CLAUDE.mdの稼働中の案件・主要ペルソナを参照し実体験ディテール(数字・固有名詞)を差し込む。5.affiliate-research-engine/playbook/workspace/drafts/$(date +%Y-%m-%d).mdとして保存。6.keywords.csvの該当キーワードのstatusをtodo→doneに更新。" \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch" \
            --dangerously-skip-permissions

      - name: Generate Instagram caption
        env:
          ANTHROPIC_API_KEY: ${{ secrets.REI_AFFSAKU }}
        run: |
          pip install anthropic -q
          python3 << 'PYEOF'
          import os, datetime, sys, re
          import anthropic

          date_str = datetime.date.today().strftime('%Y-%m-%d')
          draft_file = f"affiliate-research-engine/playbook/workspace/drafts/{date_str}.md"

          if not os.path.exists(draft_file):
              print("Draft file not found, skipping Instagram caption")
              sys.exit(0)

          with open(draft_file, 'r') as f:
              raw = f.read()

          keyword = ''
          title = ''
          if raw.startswith('---'):
              end = raw.find('\n---', 3)
              if end != -1:
                  fm = raw[:end+4]
                  m = re.search(r'^keyword:\s*(.+)$', fm, re.MULTILINE)
                  if m:
                      keyword = m.group(1).strip()
                  m = re.search(r'^title:\s*(.+)$', fm, re.MULTILINE)
                  if m:
                      title = m.group(1).strip()

          theme = keyword or title

          ai = anthropic.Anthropic(api_key=os.environ['ANTHROPIC_API_KEY'])
          msg = ai.messages.create(
              model='claude-haiku-4-5-20251001',
              max_tokens=400,
              messages=[{
                  'role': 'user',
                  'content': f"""あなたは「さくら」（27歳・営業事務・東京）というキャラクターです。
英語を5年後回しにしてきて、ワーホリを説められず、今動き始めた女性です。
英語スクールで計4.5万円溈かした失敗歴があります。

今日の記事テーマ: {theme}

Instagramの投稿キャプションを書いてください。

条件:
- 5、8行程度、短い行に区切る
- 絵文字を適度使う（🌸🥲😮‍💨✈️💸 など）
- 「後回し」「スクール失敗」「4.5万」「ワーホリ」「27歳」「30歳タイムリミット」を自然に絡める
- 読んでる人が「わかる…」と思える内容
- 最後にハッシュタグを8～10個（#英語学習 #ワーホリ準備 #社会人英語 #英会話 #留学 #ワーキングホリデー #英語勉強 #英語初心者 など）
- 広告っぽくない、自然な日常語
- URLは含めない

キャプションのテキストだけ出力してください。"""
              }]
          )

          caption = msg.content[0].text.strip()

          # Save to instagram folder
          os.makedirs('affiliate-research-engine/playbook/workspace/instagram', exist_ok=True)
          out_file = f'affiliate-research-engine/playbook/workspace/instagram/{date_str}.md'
          with open(out_file, 'w') as f:
              f.write(f'# Instagram {date_str}\n\n')
              f.write(f'**キーワード**: {theme}\n\n')
              f.write('---\n\n')
              f.write(caption)
              f.write('\n')

          print(f"Instagram caption saved: {out_file}")
          print(f"\n--- Caption ---\n{caption}")
          PYEOF

      - name: Commit draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/drafts/
          git add affiliate-research-engine/playbook/workspace/keywords.csv
          git add affiliate-research-engine/playbook/workspace/instagram/
          git diff --staged --quiet || git commit -m "chore: daily article draft $(date +%Y-%m-%d)"
          git push

      - name: Post to WordPress as draft
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          pip install requests markdown2 -q
          python3 << 'PYEOF'
          import os, datetime, sys, re
          import requests
          import markdown2
          import urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          date_str = datetime.date.today().strftime('%Y-%m-%d')
          draft_file = f"affiliate-research-engine/playbook/workspace/drafts/{date_str}.md"

          if not os.path.exists(draft_file):
              print("Draft file not found, skipping")
              sys.exit(0)

          with open(draft_file, 'r') as f:
              raw = f.read()

          title = 'Draft'
          content = raw
          if raw.startswith('---'):
              end = raw.find('\n---', 3)
              if end != -1:
                  frontmatter = raw[:end+4]
                  m = re.search(r'^title:\s*(.+)$', frontmatter, re.MULTILINE)
                  if m:
                      title = m.group(1).strip()
                  content = raw[end+4:].lstrip('\n')

          if title == 'Draft':
              m = re.search(r'^#\s+(.+)$', content, re.MULTILINE)
              if m:
                  title = m.group(1).strip()

          content = re.sub(r'^#\s+.+\n?', '', content, count=1).lstrip('\n')
          content = re.sub(r'^(#{2,6})\s+H\d[\d-]*\s*[｜|]\s*', r'\1 ', content, flags=re.MULTILINE)
          content = re.sub(r'\n---\n+\*?本記事のアフィリエイト.*$', '', content, flags=re.DOTALL)
          content = re.split(r'^### SERP分析メモ', content, maxsplit=1, flags=re.MULTILINE)[0].rstrip()

          html = markdown2.markdown(content, extras=['fenced-code-blocks', 'tables', 'break-on-newline'])

          username = 'rei.00pt2342@gmail.com'
          password = os.environ['WP_APP_PASSWORD']

          resp = requests.post(
              'https://sakura-eigo.com/wp-json/wp/v2/posts',
              auth=(username, password),
              json={'title': title, 'content': html, 'status': 'draft'},
              verify=False
          )

          if resp.status_code in (200, 201):
              result = resp.json()
              print(f"Posted: {result.get('id')} / {result.get('link')}")
          else:
              print(f"Error {resp.status_code}: {resp.text[:500]}")
              sys.exit(1)
          PYEOF

      - name: Post to X (Twitter)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.REI_AFFSAKU }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          pip install tweepy anthropic -q
          python3 << 'PYEOF'
          import os, datetime, sys, re
          import tweepy
          import anthropic

          date_str = datetime.date.today().strftime('%Y-%m-%d')
          draft_file = f"affiliate-research-engine/playbook/workspace/drafts/{date_str}.md"

          if not os.path.exists(draft_file):
              print("Draft file not found, skipping X post")
              sys.exit(0)

          with open(draft_file, 'r') as f:
              raw = f.read()

          keyword = ''
          title = ''
          if raw.startswith('---'):
              end = raw.find('\n---', 3)
              if end != -1:
                  fm = raw[:end+4]
                  m = re.search(r'^keyword:\s*(.+)$', fm, re.MULTILINE)
                  if m:
                      keyword = m.group(1).strip()
                  m = re.search(r'^title:\s*(.+)$', fm, re.MULTILINE)
                  if m:
                      title = m.group(1).strip()

          theme = keyword or title

          ai = anthropic.Anthropic(api_key=os.environ['ANTHROPIC_API_KEY'])
          msg = ai.messages.create(
              model='claude-haiku-4-5-20251001',
              max_tokens=200,
              messages=[{
                  'role': 'user',
                  'content': f"""あなたは「さくら」（27歳・営業事務・東京）というキャラクターです。
英語を5年後回しにしてきて、ワーホリを説められず、今動き始めた女性です。
英語スクールで計4.5万円溈かした失敗歴があります。

今日の記事テーマ: {theme}

このテーマに関連したさくらの日常のつぶやきを1つ書いてください。

条件:
- 280文字以内
- 短い行に区切る
- 絵文字1。2個（🥲😮‍💨✈️🌸💸 などさくららしいもの）
- 記事URLは貼らない
- 「後回し」「スクール失敗」「4.5万」「ワーホリ」「27歳」「30歳タイムリミット」などのエピソードを自然に絡める
- ハッシュタグは最後に2個まで（#英語学習 #ワーホリ など）
- 広告っぽくない、自然な日常語

つぶやきのテキストだけ出力してください。"""
              }]
          )

          tweet = msg.content[0].text.strip()
          if len(tweet) > 280:
              tweet = tweet[:277] + '...'

          print(f"Generated tweet:\n{tweet}")

          x_client = tweepy.Client(
              consumer_key=os.environ['X_API_KEY'],
              consumer_secret=os.environ['X_API_SECRET'],
              access_token=os.environ['X_ACCESS_TOKEN'],
              access_token_secret=os.environ['X_ACCESS_TOKEN_SECRET']
          )

          response = x_client.create_tweet(text=tweet)
          print(f"Tweeted ID: {response.data['id']}")
          PYEOF
