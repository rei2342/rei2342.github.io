name: Daily Article Drafter

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日06:00 JST (= 21:00 UTC)
  workflow_dispatch:       # 手動実行も可能

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Daily Article Drafter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.REI_AFFSAKU }}
        run: |
          claude -p "affiliate-research-engine/playbook/workspace/keywords.csv の status=todo から1件キーワードを選び、以下の手順で記事ドラフトを生成してください。手順: 1.keywords.csvのstatus=todoから1件選ぶ。2.そのキーワードでWeb検索しSERP上位の見出し構造・論点TOP5・抜け穴を分析。3.上位を抜く独自構造(H2x6,H3x各3)で4000字以上のドラフト生成。NG:「〜について」「〜することが大切」禁止/箇条書きで逃げない/同語尾3連続禁止/冒頭挨拶禁止。4.affiliate-research-engine/CLAUDE.mdの稼働中の案件・主要ペルソナを参照し実体験ディテール(数字・固有名詞)を差し込む。5.affiliate-research-engine/playbook/workspace/drafts/$(date +%Y-%m-%d).mdとして保存。6.keywords.csvの該当キーワードのstatusをtodo→doneに更新。" \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch" \
            --dangerously-skip-permissions

      - name: Commit draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/drafts/
          git add affiliate-research-engine/playbook/workspace/keywords.csv
          git diff --staged --quiet || git commit -m "chore: daily article draft $(date +%Y-%m-%d)"
          git push

      - name: Post to WordPress as draft
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          DRAFT_FILE="affiliate-research-engine/playbook/workspace/drafts/$(date +%Y-%m-%d).md"
          if [ ! -f "$DRAFT_FILE" ]; then
            echo "Draft file not found, skipping WordPress post"
            exit 0
          fi

          # タイトル（1行目の # を除去）
          TITLE=$(head -1 "$DRAFT_FILE" | sed 's/^# //')

          # 本文（Markdownをそのまま送る）
          CONTENT=$(cat "$DRAFT_FILE")

          # WordPress REST API で下書き投稿
          CREDENTIALS="rei.00pt2342@gmail.com:${WP_APP_PASSWORD}"
          ENCODED=$(echo -n "$CREDENTIALS" | base64 -w 0)

          curl -s -X POST "https://sakura-eigo.com/wp-json/wp/v2/posts" \
            -H "Authorization: Basic ${ENCODED}" \
            -H "Content-Type: application/json" \
            -d "{
              \"title\": $(echo "$TITLE" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))'),
              \"content\": $(echo "$CONTENT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
              \"status\": \"draft\"
            }" | python3 -c "import json,sys; r=json.load(sys.stdin); print('Posted: ' + str(r.get('id','')) + ' / ' + r.get('link',''))"
