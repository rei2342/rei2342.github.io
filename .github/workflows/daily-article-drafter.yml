name: Daily Article Drafter

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日06:00 JST (= 21:00 UTC)
  workflow_dispatch:       # 手動実行も可能

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Daily Article Drafter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.REI_AFFSAKU }}
          CLAUDE_CODE_USE_BEDROCK: '0'
        run: |
          PROMPT=$(cat <<'PROMPT_EOF'
          affiliate-research-engine/playbook/workspace/keywords.csv の status=todo から1件キーワードを選び、以下の手順で記事ドラフトを生成してください。

          手順:
          1. keywords.csv の status=todo から1件キーワードを選ぶ。
          2. そのキーワードでWeb検索しSERP上位の見出し構造・論点TOP5・抜け穴を分析する。
          3. 上位を抜く独自構造（H2×6、H3×各3）で4000字以上のドラフトを生成。
             NG: 「〜について」「〜することが大切」禁止 / 箇条書きで逃げない / 同語尾3連続禁止 / 冒頭挨拶禁止
          4. affiliate-research-engine/CLAUDE.md の「稼働中の案件」「主要ペルソナ」を参照し実体験ディテール（数字・固有名詞）を差し込む。
          5. affiliate-research-engine/playbook/workspace/drafts/$(date +%Y-%m-%d).md として保存する。
          6. keywords.csv の該当キーワードの status を todo → done に更新する。
          PROMPT_EOF
          )
          claude --print --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch" "$PROMPT"

      - name: Commit draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/drafts/
          git add affiliate-research-engine/playbook/workspace/keywords.csv
          git diff --staged --quiet || git commit -m "chore: daily article draft $(date +%Y-%m-%d)"
          git push
