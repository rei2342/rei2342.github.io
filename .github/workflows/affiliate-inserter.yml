name: Affiliate Inserter

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（プレビュー保存のみ・WP更新なし）'
        type: boolean
        default: true

jobs:
  insert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests -q

      - name: Insert affiliate CTAs
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python affiliate-research-engine/playbook/scripts/affiliate_inserter.py

      - name: Commit previews and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/affiliate_inserts/
          git diff --staged --quiet || git commit -m "feat: affiliate insert report $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
