name: 週次レポート（月曜）

# gsc-weekly（月07:00）と wp-audit（土06:00）を1本にまとめたもの。
# 土曜の記事点検はIssueに出していなかったため、34本の指摘が出ても
# リポジトリを見に行かないと気づけなかった。週に1通、同じ場所に出す。
#
# 案件クローリング（月06:00）の結果もここに載せる。
# 別々に置いても読みに行かないので、1通にまとめて届ける。

on:
  schedule:
    - cron: '0 22 * * 0'      # 毎週月曜 07:00 JST
  workflow_dispatch:
    inputs:
      days:
        description: 'Search Consoleで集計する日数'
        required: false
        default: '28'
      min_chars:
        description: '記事点検の下限文字数'
        required: false
        default: '3000'

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-auth -q

      # 片方がこけても、もう片方は届けたい
      - name: Search Consoleの数字を取る
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DAYS: ${{ inputs.days || '28' }}
        run: python affiliate-research-engine/playbook/scripts/gsc_fetch.py

      - name: 公開記事を点検する
        continue-on-error: true
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          MIN_CHARS: ${{ inputs.min_chars || '3000' }}
        run: python affiliate-research-engine/playbook/scripts/wp_audit.py

      - name: 1通にまとめてIssueに投稿
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          W=affiliate-research-engine/playbook/workspace
          OUT=/tmp/issue.md
          {
            echo "# 週次レポート $(date +%Y-%m-%d)"
            echo
            echo "## 記事の劣化チェック"
            echo
            # 見出しの階層を1つ下げて、1通の中で入れ子が壊れないようにする
            if [ -f "$W/site/AUDIT.md" ]; then
              sed '1d; s/^#/##/' "$W/site/AUDIT.md"
            else
              echo "（点検できなかった）"
            fi
            echo
            echo "## 検索の数字（Search Console）"
            echo
            if [ -f "$W/gsc/LATEST.md" ]; then
              sed '1d; s/^#/##/' "$W/gsc/LATEST.md"
            else
              echo "（取得できなかった）"
            fi
            echo
            echo "## 新規案件の候補"
            echo
            if [ -f "$W/program_candidates.md" ]; then
              sed 's/^#/##/' "$W/program_candidates.md" | head -80
            else
              echo "（候補ファイルなし）"
            fi
            printf '\n---\n自動生成。読んだら閉じてください。\n'
          } > $OUT

          head -c 60000 $OUT > /tmp/issue_trimmed.md
          jq -n --arg t "週次レポート $(date +%Y-%m-%d)" \
                --rawfile b /tmp/issue_trimmed.md '{title:$t, body:$b}' > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @/tmp/payload.json | head -c 200
          echo ""

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/gsc/ \
                  affiliate-research-engine/playbook/workspace/site/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: weekly report $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin "${{ github.ref_name }}" || true
            if git rebase -X theirs "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
