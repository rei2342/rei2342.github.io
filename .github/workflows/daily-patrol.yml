name: 日次パトロール

# Threadsの数字とサイトの数字を1枚にまとめる。
# 表示 → 着地 → アフィリンクのクリック、の3段のどこで落ちているかを毎日出す。
#
# threads-insights（12:00）と ga4-fetch（12:00）の後に回すので 12:20。
# Issueに投げるのは、リポジトリを見に行かないと気づけないため。

on:
  schedule:
    - cron: '20 3 * * *'      # 毎日 12:20 JST
  workflow_dispatch:
    inputs:
      days:
        description: '集計する日数'
        required: false
        default: '14'

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-auth -q

      - name: まとめる
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          DAYS: ${{ inputs.days || '14' }}
        run: python affiliate-research-engine/playbook/scripts/daily_patrol.py

      - name: Issueに投稿
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=affiliate-research-engine/playbook/workspace/patrol/PATROL.md
          [ -f "$BODY" ] || { echo "レポートが無い"; exit 0; }
          head -c 60000 "$BODY" > /tmp/issue.md
          jq -n --arg t "パトロール $(date +%Y-%m-%d)" \
                --rawfile b /tmp/issue.md '{title:$t, body:$b}' > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @/tmp/payload.json | head -c 200
          echo ""

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/patrol/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: patrol $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main || true
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
