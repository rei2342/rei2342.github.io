name: 記事本文の取り出し

# 改修案を書くには全文が要る。実行環境からサイトへ到達できないので
# Actions 側で取ってリポジトリに置く。記事は書き換えない。

on:
  workflow_dispatch:
    inputs:
      posts:
        description: '記事ID（カンマ区切り。空なら全公開記事）'
        required: false
        default: ''

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests janome -q
      - name: 取り出す
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          POSTS: ${{ inputs.posts }}
        run: python affiliate-research-engine/playbook/scripts/article_dump.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/claims/posts/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: article dump $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin "${{ github.ref_name }}" || true
            if git rebase -X theirs "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
