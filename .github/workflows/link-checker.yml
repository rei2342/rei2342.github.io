name: アフィリンクの遷移先を確かめる

# 記事の説明とリンク先が一致しているかを見る。
# speek（発音矯正）と Speak（AI英会話アプリ）のような取り違えを捕まえる。
#
# ⚠️ リンクを1本たどるたびに、ASPに本人クリックが1件計上される。
# **定期実行しない。** 必要なときだけ手で回す。
# ASPの管理画面には入らない（BAN回避）。公開リンクをたどるだけ。

on:
  workflow_dispatch:
    inputs:
      only:
        description: '確かめるサービス名（リンク文言に含まれる語・カンマ区切り。空なら全部）'
        required: false
        default: 'speek'
      posts:
        description: '対象記事ID（カンマ区切り。空なら全記事）'
        required: false
        default: ''

concurrency:
  group: link-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests -q

      - name: 遷移先をたどる
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ONLY: ${{ inputs.only }}
          POSTS: ${{ inputs.posts }}
        run: python affiliate-research-engine/playbook/scripts/link_checker.py

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/claims/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: link audit $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main || true
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
