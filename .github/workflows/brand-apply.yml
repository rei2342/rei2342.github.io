name: ブランド反映（サイト名・カテゴリ）

# サイト名・キャッチフレーズを更新し、新カテゴリを作る。
# **既存カテゴリのslugは1つも変更しない**（301が要らない形にする）。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true なら書かずにバックアップと差分だけ'
        required: false
        default: 'true'
      frontpage:
        description: 'true ならトップページの固定化も実行'
        required: false
        default: 'false'
      skip_brand:
        description: 'true ならサイト名・カテゴリの反映を飛ばす'
        required: false
        default: 'false'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests janome -q
      - name: トップページの固定化（記事一覧を先に作る）
        if: inputs.frontpage == 'true'
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python affiliate-research-engine/playbook/scripts/frontpage_apply.py

      - name: 反映（バックアップを取ってから）
        if: inputs.skip_brand != 'true'
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python affiliate-research-engine/playbook/scripts/brand_apply.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: brand apply $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main || true
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
