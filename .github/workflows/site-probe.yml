name: サイトの状態を調べる

# サイトマップのURLなど、外形的に確認したいことを調べる。
# ローカル環境からは sakura-eigo.com へ出られないため、Actions から叩く。

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: 'OGPを調べる記事URL'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
        run: |
          mkdir -p affiliate-research-engine/playbook/workspace/site
          OUT=affiliate-research-engine/playbook/workspace/site/PROBE.md
          echo "# サイト外形チェック $(date +%Y-%m-%d\ %H:%M)" > $OUT
          echo "" >> $OUT

          echo "## 接続診断" >> $OUT
          echo '```' >> $OUT
          echo "--- 通常接続 ---" >> $OUT
          curl -sS -o /dev/null -w "http_code=%{http_code} ssl_verify=%{ssl_verify_result}\n" \
            -A "Mozilla/5.0" --max-time 20 https://sakura-eigo.com/ 2>&1 >> $OUT || true
          echo "--- 証明書検証を無効化 ---" >> $OUT
          curl -skS -o /dev/null -w "http_code=%{http_code}\n" \
            -A "Mozilla/5.0" --max-time 20 https://sakura-eigo.com/ 2>&1 >> $OUT || true
          echo "--- 証明書の内容 ---" >> $OUT
          echo | timeout 20 openssl s_client -connect sakura-eigo.com:443 \
            -servername sakura-eigo.com 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>&1 >> $OUT || echo "(証明書を取得できず)" >> $OUT
          echo "--- www 側 ---" >> $OUT
          curl -sS -o /dev/null -w "http_code=%{http_code}\n" \
            -A "Mozilla/5.0" --max-time 20 https://www.sakura-eigo.com/ 2>&1 >> $OUT || true
          echo '```' >> $OUT
          echo "" >> $OUT

          echo "## robots.txt" >> $OUT
          echo '```' >> $OUT
          curl -skS -A "Mozilla/5.0" --max-time 20 https://sakura-eigo.com/robots.txt >> $OUT || echo "(取得失敗)" >> $OUT
          echo '```' >> $OUT
          echo "" >> $OUT

          echo "## サイトマップ候補のHTTPステータス" >> $OUT
          echo "| URL | ステータス | 種類 |" >> $OUT
          echo "|---|---|---|" >> $OUT
          for p in wp-sitemap.xml sitemap_index.xml sitemap.xml sitemap-index.xml \
                   sitemap.xml.gz wp-sitemap-posts-post-1.xml feed; do
            url="https://sakura-eigo.com/$p"
            code=$(curl -skS -o /tmp/body -w "%{http_code}" -A "Mozilla/5.0" --max-time 20 "$url" || echo "ERR")
            ctype=$(head -c 200 /tmp/body 2>/dev/null | tr -d '\n' | cut -c1-60)
            echo "| $p | $code | \`$ctype\` |" >> $OUT
          done
          echo "" >> $OUT

          echo "## アクセス解析で使えそうなもの" >> $OUT
          echo '```' >> $OUT
          echo "--- REST APIの名前空間（統計プラグインが居ればここに出る） ---" >> $OUT
          curl -skS -A "Mozilla/5.0" --max-time 20 https://sakura-eigo.com/wp-json/ \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(d.get('namespaces',[])))" \
            >> $OUT 2>&1 || echo "(取得失敗)" >> $OUT
          echo "" >> $OUT
          echo "--- Jetpack統計が使えるか ---" >> $OUT
          curl -skS -o /dev/null -w "jetpack/v4: %{http_code}\n" --max-time 20 \
            https://sakura-eigo.com/wp-json/jetpack/v4/module/stats >> $OUT 2>&1 || true
          echo "--- 計測ID（どのGA4プロパティに送っているか）---" >> $OUT
          # プロパティを取り違えていないか確かめるのに要る。
          # 2026-08-06に、権限を渡したプロパティが別サイト(nizikake.jp)のもので、
          # sakura-eigo.com の数字が1件も入っていなかった。
          curl -skS -A "Mozilla/5.0" --max-time 20 https://sakura-eigo.com/ \
            | grep -oE "G-[A-Za-z0-9]{6,}|GTM-[A-Za-z0-9]{5,}|UA-[0-9]{4,}-[0-9]+" \
            | sort | uniq -c >> $OUT 2>&1 || echo "(計測IDが見つからない)" >> $OUT
          echo "" >> $OUT
          echo "--- google が出てくる箇所（IDが取れないときの手がかり）---" >> $OUT
          # 「googletagmanager」があってもIDが無い場合、それは dns-prefetch の
          # ヒントだけで、実際のタグは出ていない。前後を見ないと判別できない。
          curl -skS -A "Mozilla/5.0" --max-time 20 https://sakura-eigo.com/ \
            | tr '>' '>\n' \
            | grep -i "google" | head -12 >> $OUT 2>&1 || echo "(該当なし)" >> $OUT
          echo "" >> $OUT
          echo "--- その他の解析ツール ---" >> $OUT
          curl -skS -A "Mozilla/5.0" --max-time 20 https://sakura-eigo.com/ \
            | grep -ioE "jetpack|site-kit|matomo|clarity" \
            | sort | uniq -c >> $OUT 2>&1 || echo "(なし)" >> $OUT
          echo '```' >> $OUT
          echo "" >> $OUT

          echo "## 記事のOGP（SNSのプレビュー画像）" >> $OUT
          # Threadsのプレビューに画像が出ないことがあった（2026-08-07）。
          # og:image が出ているか、その画像が実際に取れるかを分けて見る。
          echo '```' >> $OUT
          ART="${ARTICLE_URL:-https://sakura-eigo.com/online-english-lessons-90-days-success/}"
          echo "対象: $ART" >> $OUT
          curl -skS -A "facebookexternalhit/1.1" --max-time 20 "$ART" \
            | tr '>' '>\n' | grep -iE 'og:(image|title|description)|twitter:(image|card)' \
            | head -10 >> $OUT 2>&1 || echo "(OGPタグが見つからない)" >> $OUT
          echo "--- og:image が実際に取れるか ---" >> $OUT
          IMG=$(curl -skS -A "facebookexternalhit/1.1" --max-time 20 "$ART" \
            | tr '>' '>\n' | grep -i 'og:image"' | head -1 \
            | sed -E 's/.*content="([^"]+)".*/\1/')
          if [ -n "$IMG" ]; then
            echo "URL: $IMG" >> $OUT
            curl -skS -o /dev/null -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" \
              --max-time 20 "$IMG" >> $OUT 2>&1 || true
          else
            echo "(og:image が無い)" >> $OUT
          fi
          echo '```' >> $OUT
          echo "" >> $OUT

          echo "## トップページの head 抜粋（SEOプラグイン判定）" >> $OUT
          echo '```' >> $OUT
          curl -skS -A "Mozilla/5.0" --max-time 20 https://sakura-eigo.com/ \
            | grep -ioE '(rank.?math|yoast|seo.simple.pack|all.in.one.seo|google-site-verification[^>]*)' \
            | sort -u | head -20 >> $OUT || echo "(判定できず)" >> $OUT
          echo '```' >> $OUT

          cat $OUT

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/site/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: site probe $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin "${{ github.ref_name }}" || true
            if git rebase -X theirs "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
