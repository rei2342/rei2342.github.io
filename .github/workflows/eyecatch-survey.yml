name: アイキャッチの棚卸し（読むだけ）

# 画像・記事・ワークフローは変更しない。回収して並べるだけ。

on:
  workflow_dispatch:

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 日本語フォント
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install requests pillow -q
      - env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python affiliate-research-engine/playbook/scripts/eyecatch_survey.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: eyecatch survey $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin "${{ github.ref_name }}" || true
            if git rebase -X theirs "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
