name: Search Consoleの数字を取る

# 記事別のアクセスを取得し、どの案件を載せた記事が読まれているかまで集計する。
# ASPの管理画面では案件別の内訳しか出ないので、その手前を埋める。

on:
  schedule:
    - cron: '0 22 * * 0'      # 毎週月曜 07:00 JST
  workflow_dispatch:
    inputs:
      days:
        description: '集計する日数'
        required: false
        default: '28'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-auth -q

      - name: Fetch
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DAYS: ${{ inputs.days || '28' }}
        run: python affiliate-research-engine/playbook/scripts/gsc_fetch.py

      # レポートはリポジトリに置くだけだと見に行かないと気づけない。
      # Issue に投稿すると通知メールが届くので、開くだけで数字が読める。
      - name: Issueに投稿
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=affiliate-research-engine/playbook/workspace/gsc/LATEST.md
          [ -f "$BODY" ] || { echo "レポートが無い"; exit 0; }

          # 表示が0の週は読む価値がないので通知しない（毎週空メールが来ると見なくなる）
          if grep -q '合計表示: \*\*0\*\*' "$BODY"; then
            echo "データが0件のため通知しない"
            exit 0
          fi

          # Issue本文の上限に収まるよう念のため切り詰める
          head -c 60000 "$BODY" > /tmp/issue.md
          printf '\n\n---\n自動生成。読んだら閉じてください。\n' >> /tmp/issue.md

          # 本文にバッククォートや引用符が混ざるので jq に組み立てさせる
          jq -n --arg t "週次レポート $(date +%Y-%m-%d) — Search Console" \
                --rawfile b /tmp/issue.md \
                '{title:$t, body:$b}' > /tmp/payload.json

          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @/tmp/payload.json \
            | head -c 200
          echo ""

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/gsc/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: GSC report $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main || true
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
