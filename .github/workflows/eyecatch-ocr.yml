name: アイキャッチ画像のOCR監査

# 画像を実際に取得して、中の文字を tesseract で読む。
# 「機械で読めない」で止めない。自動で差し替えはしない。

on:
  workflow_dispatch:

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: tesseract を入れる（日本語つき）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn tesseract-ocr-jpn-vert
          tesseract --version
          tesseract --list-langs
      - run: pip install requests janome -q
      - env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python affiliate-research-engine/playbook/scripts/eyecatch_ocr.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/seo/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: eyecatch ocr $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main || true
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
