name: Affiliate Program Collector

# 規約セーフな案件クローリング自動システム。
# ログイン/スクレイピングは一切せず、公開Web検索(WebSearch/WebFetch)だけで
# さくら(英語×留学)ニッチの新規アフィリエイト案件を発見・ランク付けし、
# program_candidates.csv / .md を更新する。ASP会員エリアには触れない。

on:
  schedule:
    - cron: '0 21 * * 0'   # 毎週月曜 06:00 JST（週次レポート07:00の前に終わらせる）
  workflow_dispatch:
    inputs:
      focus:
        description: '今回重点的に探すサブテーマ（任意。例: TOEIC / ワーホリ / 教材）'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Collect affiliate program candidates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.REI_AFFSAKU }}
          FOCUS: ${{ github.event.inputs.focus }}
        run: |
          claude -p "日本のアフィリエイト案件を公開Web検索で調べ、さくら(英語学習×留学)アカウントが新規申請すべき案件を発見してファイル更新する。規約厳守: ログイン不要・ASP会員エリアのスクレイピング禁止・公開ページ(公式アフィリエイト紹介/比較記事/公式LP)のみ参照。

          手順:
          1. affiliate-research-engine/CLAUDE.md を読み『稼働中/申請済みの案件』と『田中さくら』ペルソナ・トーンを把握する。既存案件と重複するものは新規候補にしない(重複は skip)。
          2. affiliate-research-engine/playbook/workspace/program_candidates.csv が無ければヘッダ行 'program_name,asp,category,est_reward,conversion,approval_difficulty,self_back,sakura_fit,apply_status,source_url,note,found_at' で新規作成。既にあれば既存 program_name を読み、重複追加しない。
          3. WebSearch/WebFetch で次のテーマの案件を横断的に探す: 英会話/オンライン英会話/英語コーチング/留学/ワーホリ/TOEIC/英語教材。ASPはA8/もしも/afb/アクセストレード/バリューコマース/felmat等を公開情報から。環境変数 FOCUS ($FOCUS) が空でなければそのサブテーマを重点的に。
          4. 新規案件ごとに1行追記。category=英会話|留学|コーチング|TOEIC|ワーホリ|教材 のいずれか。est_reward=想定成果報酬(円,範囲可,不明はunknown)。conversion=無料体験|無料登録|有料申込|資料請求 等。approval_difficulty=low|mid|high(新規サイトでの提携審査の通りやすさ推定)。self_back=yes|no|unknown(セルフバック可否)。sakura_fit=1-5(さくら文脈への刺さり)。apply_status=candidate 固定。source_url=参照した公開URL。note=一言(単価根拠や承認のコツ)。found_at=本日のUTC日付(YYYY-MM-DD)。捏造禁止・不明はunknown。今回で3〜8件を目安に追加。
          5. affiliate-research-engine/playbook/workspace/program_candidates.md を『最終更新日 / 今回追加した案件 / sakura_fit×承認しやすさ×単価 で並べた申請おすすめTOP10表 / 申請前チェックリスト』の構成で上書き生成する(csv全体を反映)。承認難易度lowを優先的に上位へ。
          6. 事実と推測を区別し、単価や承認率は『公開情報で確認』と『推定』を note で明示する。" \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch" \
            --dangerously-skip-permissions

      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/program_candidates.csv \
                  affiliate-research-engine/playbook/workspace/program_candidates.md
          git diff --staged --quiet || git commit -m "chore: affiliate program candidates $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}" || true
