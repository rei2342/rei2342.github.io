name: X Poster（承認済み在庫だけを出す）

# **生成しない。** 承認済みの在庫を1日1件だけ投稿する。
# 2026-08-09に、生成して即投稿する運用を止めた。
# 文面は scripts/social_generate.py が作り、人が承認するまで出ない。
# ルールは config/social/sakura-social-v1.yaml が正本。

on:
  schedule:
    - cron: '30 3 * * *'    # 12:30 JST。1日1枠だけ
  workflow_dispatch:
    inputs:
      approve:
        description: '実際に投稿する（外すと出す予定を表示するだけ）'
        type: boolean
        default: false
      stock_id:
        description: '投稿する在庫を名指しする（例 X-546-b）。空なら最古の承認済みを自動で選ぶ'
        type: string
        required: false
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests tweepy pyyaml -q
      - name: 承認済みを1件だけ出す
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          APPROVE: ${{ inputs.approve }}
          STOCK_ID: ${{ inputs.stock_id }}
        run: |
          cd affiliate-research-engine/playbook
          # **在庫の指定は引数で渡す。** 定期実行では空なので、
          # これまでどおり最古の承認済みが選ばれる
          ARGS="--platform x"
          if [ -n "$STOCK_ID" ]; then
            ARGS="$ARGS --stock-id $STOCK_ID"
          fi
          if [ "$APPROVE" = "true" ]; then
            ARGS="$ARGS --approve"
          fi
          echo "実行: python scripts/social_post.py $ARGS"
          python scripts/social_post.py $ARGS
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/social/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: social post state $(date -u +%Y-%m-%dT%H:%MZ)"
          # **走ったブランチへ戻す。** 在庫は作業ブランチにしか無いので、
          # main へ押し込むとブランチ全体が main に入ってしまう
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
