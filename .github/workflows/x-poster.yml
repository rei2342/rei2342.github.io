name: X Poster（承認済み在庫だけを出す）

# **生成しない。** 承認済みの在庫を1日1件だけ投稿する。
# 2026-08-09に、生成して即投稿する運用を止めた。
# 文面は scripts/social_generate.py が作り、人が承認するまで出ない。
# ルールは config/social/sakura-social-v1.yaml が正本。

on:
  schedule:
    - cron: '30 3 * * *'    # 12:30 JST。1日1枠だけ
  workflow_dispatch:
    inputs:
      approve:
        description: '実際に投稿する（外すと出す予定を表示するだけ）'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests tweepy pyyaml -q
      - name: 承認済みを1件だけ出す
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          APPROVE: ${{ inputs.approve }}
        run: |
          cd affiliate-research-engine/playbook
          if [ "$APPROVE" = "true" ]; then
            python scripts/social_post.py --platform x --approve
          else
            python scripts/social_post.py --platform x
          fi
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/social/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: social post state $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
