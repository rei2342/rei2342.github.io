name: 保留した記事を再照合して出す

on:
  workflow_dispatch:
    inputs:
      post:
        description: '記事ID'
        required: true
      url:
        description: '照合する引用元URL'
        required: true
      words:
        description: 'ページにあるはずの語（カンマ区切り）'
        required: true
      when:
        description: '予約日時（2026-08-12T07:00:00）。空なら即公開'
        required: false
        default: ''
      dry_run:
        description: 'true なら書かない'
        required: false
        default: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: wp-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests -q
      - env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          POST: ${{ inputs.post }}
          URL: ${{ inputs.url }}
          WORDS: ${{ inputs.words }}
          WHEN: ${{ inputs.when }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python affiliate-research-engine/playbook/scripts/hold_release.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: hold release $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin "${{ github.ref_name }}" || true
            if git rebase -X theirs "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
