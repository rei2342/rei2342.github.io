name: 記事をXで告知する

# 公開済みの記事を、記事URL付きでXに1投稿する。
# 65投稿の実測でリンク付き（平均43.0）がリンクなし（平均24.9）を上回ったため、
# 記事公開のたびにこれを回す運用にする。
# 公開前の記事は中止する（下書きURLに飛ばさないため）。

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: '告知する記事のID（公開済みであること）'
        required: true
      dry_run:
        description: 'ドライラン（内容を出すだけで投稿しない）'
        type: boolean
        default: true
      post_text:
        description: '手入れした本文（空なら自動生成。リンクは書かない）'
        required: false
        default: ''

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic tweepy -q

      - name: Post
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.REI_AFFSAKU }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ARTICLE_ID: ${{ inputs.article_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          POST_TEXT: ${{ inputs.post_text }}
        run: python affiliate-research-engine/playbook/scripts/x_promo.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/x_state.json affiliate-research-engine/playbook/workspace/x_promo/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: X promo state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch origin main || true
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
