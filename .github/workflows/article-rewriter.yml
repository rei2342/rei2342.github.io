name: Rewrite Articles

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（ファイル保存のみ・WP更新なし）'
        type: boolean
        default: true
      target_ids:
        description: '対象の記事ID（カンマ区切り。空ならスクリプト既定の一覧）'
        required: false
        default: ''
      min_chars:
        description: '本文の目標文字数（5000が実績のある水準。6000以上は未達が増える）'
        required: false
        default: '5000'

# 同じファイルを書くジョブが重なるとリベースで衝突し、生成結果が丸ごと失われる。
# 実際に40分ぶんの生成が捨てられたので、多重起動は待たせる。
concurrency:
  group: article-rewriter
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests -q

      - name: Rewrite articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.REI_AFFSAKU }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_IDS: ${{ inputs.target_ids }}
          MIN_CHARS: ${{ inputs.min_chars }}
        run: python affiliate-research-engine/playbook/scripts/article_rewriter.py

      # push が失敗しても生成物を回収できるようにしておく（40分ぶんを失った教訓）
      - name: Upload rewrites as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewrites-${{ github.run_id }}
          path: affiliate-research-engine/playbook/workspace/rewrites/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit rewrites and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/rewrites/
          git diff --staged --quiet && { echo "変更なし"; exit 0; }
          git commit -m "feat: article rewrites $(date +%Y-%m-%d)"
          # 生成物は使い捨てではないので、衝突しても諦めず自分の版を採用して押し込む。
          # rebase 中の -X theirs は「今リベース中のコミット（＝今回の生成物）」を優先する。
          for i in 1 2 3 4 5; do
            git fetch origin main || true
            if git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "push 成功"; exit 0
            fi
            git rebase --abort || true
            sleep $((i * 5))
          done
          echo "::error::5回試したが push できなかった。生成物はジョブのログとアーティファクトに残る"
          exit 1
