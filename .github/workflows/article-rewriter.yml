name: Rewrite Articles

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（ファイル保存のみ・WP更新なし）'
        type: boolean
        default: true
      target_ids:
        description: '対象の記事ID（カンマ区切り。空ならスクリプト既定の一覧）'
        required: false
        default: ''
      min_chars:
        description: '本文の目標文字数'
        required: false
        default: '4000'

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests -q

      - name: Rewrite articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.REI_AFFSAKU }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_IDS: ${{ inputs.target_ids }}
          MIN_CHARS: ${{ inputs.min_chars }}
        run: python affiliate-research-engine/playbook/scripts/article_rewriter.py

      - name: Commit rewrites and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/rewrites/
          git diff --staged --quiet || git commit -m "feat: article rewrites $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
