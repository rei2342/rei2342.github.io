name: 最終確認（外観・クロール・台帳）

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true ならメニュー追加をしない'
        required: false
        default: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    concurrency:
      group: wp-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests -q
      - name: サイト外観
        if: always()
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python affiliate-research-engine/playbook/scripts/site_final_check.py
      - name: クロール
        if: always()
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python affiliate-research-engine/playbook/scripts/link_crawl.py
      - name: 最終台帳
        if: always()
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python affiliate-research-engine/playbook/scripts/final_ledger.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: final check $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin "${{ github.ref_name }}" || true
            if git rebase -X theirs "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
