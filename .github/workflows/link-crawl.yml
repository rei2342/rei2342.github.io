name: 内部リンクのクロール検証

on:
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests janome -q
      - env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python affiliate-research-engine/playbook/scripts/link_crawl.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/seo/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: link crawl $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin "${{ github.ref_name }}" || true
            if git rebase -X theirs "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
