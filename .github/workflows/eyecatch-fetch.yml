name: アイキャッチ画像の実物を持ち帰る

# tesseract で読めない画像を目で確認するために、実物をリポジトリへ置く。

on:
  workflow_dispatch:
    inputs:
      posts:
        description: '記事ID（カンマ区切り。空なら全記事）'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow -q
      - env:
          POSTS: ${{ inputs.posts }}
        run: python affiliate-research-engine/playbook/scripts/eyecatch_fetch.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-research-engine/playbook/workspace/ || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: eyecatch files $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main || true
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 5))
          done
